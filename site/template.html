        const eff = S.source === 'live' && S.live.data ? 'live' : 'demo'

                      `<button type="button" data-action="lang" data-value="${v}" aria-pressed="${S.lang === v}" class="rounded-full px-3 py-1.5 text-[13px] font-bold text-white/85 transition-colors group-data-[solid=true]:text-muted aria-pressed:bg-lime-400 aria-pressed:text-moss-950 group-data-[solid=true]:aria-pressed:text-moss-950">${v.toUpperCase()}</button>`,
                  )
                  .join('')}
              </div>
              <a href="#contact" class="hidden rounded-full bg-white px-4 py-2 text-sm font-bold text-moss-950 transition-all duration-300 hover:-translate-y-0.5 hover:bg-lime-400 sm:inline-flex group-data-[solid=true]:bg-moss-900 group-data-[solid=true]:text-white group-data-[solid=true]:hover:bg-moss-800">${L_.contact}</a>
            </div>
          </nav>`
      }

      /* ================================================================
       * Hero + stats + mission
       * ================================================================ */
      function renderHero() {
        const L_ = l()
        $('#hero').innerHTML = `
          <div class="absolute inset-0 -z-10 bg-moss-800">
            ${photo('hero', 2000, 'hero-photo size-full object-cover saturate-[.8]', '')}
          </div>
          <div class="absolute inset-0 -z-10 bg-moss-950/35"></div>
          <div class="absolute inset-0 -z-10 bg-gradient-to-r from-moss-950/75 via-moss-950/35 to-moss-950/5"></div>
          <div class="absolute inset-0 -z-10 bg-gradient-to-b from-moss-950/60 via-transparent to-moss-950/80"></div>
          <div class="mx-auto w-full max-w-6xl px-5 sm:px-8">
            <div class="max-w-2xl" data-reveal>
              <h1 class="text-[2.6rem] font-extrabold leading-[1.05] tracking-tight sm:text-6xl lg:text-7xl [@media(min-width:640px)_and_(max-height:780px)]:text-5xl">${L_.heroTitle}</h1>
              <p class="mt-5 max-w-xl text-lg leading-relaxed text-white/80">${L_.heroSub}</p>
              <div class="mt-8 flex flex-wrap gap-3">
                ${pillBtn(`${L_.partnership}${icon('arrow-up-right', 'size-4')}`, 'data-action="goto" data-value="contact"', 'lime')}
                ${pillBtn(L_.meetFarmers, 'data-action="goto" data-value="farmers"', 'outline')}
              </div>
            </div>
            <div class="mt-12 flex flex-wrap items-end justify-between gap-6 [@media(max-height:780px)]:mt-7" data-reveal style="transition-delay:180ms">
              <div id="hero-chip" class="max-w-xl"></div>
              <a href="#stats" aria-label="${L_.scrollDown}" class="hidden size-12 place-items-center rounded-full border border-white/40 text-white transition-all duration-300 hover:bg-white/10 sm:grid">${icon('arrow-down', 'size-5')}</a>
            </div>
          </div>`
      }

      // Only the chip changes with the numbers, so the hero photo never reloads.
      function renderHeroChip() {
        const top = D.plans[0]
        const glyph = top.type === 'water' ? 'droplets' : top.type === 'wait' ? 'cloud-rain' : 'check'
        $('#hero-chip').innerHTML = `
          <button type="button" data-action="open-advice" data-value="${top.plot.id}" class="flex items-center gap-3 rounded-full border border-white/25 bg-white/10 py-2 pl-2 pr-5 text-left backdrop-blur-md transition-all duration-300 hover:-translate-y-0.5 hover:bg-white/20">
            <span class="grid size-10 shrink-0 place-items-center rounded-full bg-lime-400 text-moss-950">${icon(glyph, 'size-5')}</span>
            <span class="text-[15px] font-semibold leading-snug"><span class="text-lime-300">${t().today}:</span> ${bannerText(D.plans, D.nowFarm, S.lang)}</span>
          </button>`
      }

      function renderStats() {
        $('#stats').innerHTML = `
          <div class="mx-auto grid max-w-6xl grid-cols-2 gap-x-6 gap-y-8 px-5 py-9 sm:px-8 lg:grid-cols-4">
            ${l()
              .stats.map(
                (s, i) => `
              <div data-reveal style="transition-delay:${i * 90}ms">
                <p class="tabular whitespace-nowrap font-extrabold tracking-tight ${s.text ? 'text-[2.4rem] sm:text-6xl' : 'text-5xl sm:text-6xl'}">
                  ${s.text ? s.text : `<span data-count="${s.value}">${s.value}</span>`}${s.unit ? `<span class="text-3xl font-bold text-lime-400 sm:text-4xl">${s.unit}</span>` : ''}
                </p>
                <p class="mt-3 text-[15px] font-semibold text-white">${s.label}</p>
                <p class="mt-0.5 text-sm text-moss-100/70">${s.note}</p>
              </div>`,
              )
              .join('')}
          </div>`
      }

      function renderMission() {
        const L_ = l()
        const words = (s, cls = 'word') => s.split(' ').map((w) => `<span class="${cls}">${w}</span>`).join(' ')
        $('#mission').innerHTML = `
          <p class="max-w-5xl text-[1.7rem] font-bold leading-[1.3] tracking-tight sm:text-4xl sm:leading-[1.25]" data-mission>
            ${words(L_.missionA)}
            <span class="relative mx-1 inline-block h-[0.9em] w-[2.4em] translate-y-[0.1em] overflow-hidden rounded-full bg-moss-700 align-baseline">${photo('house', 400, 'size-full object-cover')}</span>
            ${words(L_.missionB, 'word soft')}
          </p>`
      }

      /* ================================================================
       * Farm plan (SVG)
       * ================================================================ */
      /* Modern "digital farm" plan: dark moss ground with a survey grid, glossy plots that
         cast soft shadows, floating data chips, a glowing selection and a glowing water line. */
      const DROUGHT = ['#7ccf45', '#c9cf52', '#f2b134', '#e07b2a', '#d9552f']
      const PLOT_FILL = {
        moisture: { good: '#7ccf45', wet: '#7ccf45', low: '#bfd154', veryLow: '#dccb8c' },
        ndvi: (v) => (v > 0.65 ? '#3fae4a' : v >= 0.55 ? '#9fd55a' : '#dccb8c'),
      }
      function plotLook(p) {
        if (S.layer === 'ndvi') return { fill: PLOT_FILL.ndvi(p.ndvi), over: '' }
        if (S.layer === 'drought') return { fill: DROUGHT[p.level], over: p.level >= 3 ? 'url(#hatch)' : '' }
        const k = p.mStatus.key
        return { fill: PLOT_FILL.moisture[k], over: k === 'veryLow' ? 'url(#dryDense)' : k === 'low' ? 'url(#drySparse)' : '' }
      }
      // This page draws the plots wider than the shared geometry (about 72% of the canvas).
      const LAYOUT = {
        A: { x: 170, y: 120, w: 420, h: 175, flow: 'M600 90V207H578' },
        B: { x: 610, y: 120, w: 420, h: 175, flow: 'M600 90V207H622' },
        C: { x: 170, y: 318, w: 420, h: 175, flow: 'M600 90V405H578' },
        D: { x: 610, y: 318, w: 420, h: 175, flow: 'M600 90V405H622' },
      }
      // Flat, low-contrast canopy clusters at the edges: context, not decoration.
      const GROVES = [
        [58, 150, 30], [96, 128, 22], [70, 300, 36], [108, 332, 24], [62, 450, 30], [100, 478, 20],
        [1138, 160, 32], [1100, 136, 20], [1130, 300, 26], [1146, 440, 34], [1106, 470, 22],
        // tree line along the bottom edge, inside the phone view of the map
        [186, 548, 22], [236, 560, 16], [312, 552, 24], [388, 562, 15], [468, 550, 21], [548, 561, 14],
        [652, 551, 22], [726, 562, 15], [800, 549, 24], [880, 560, 17], [958, 551, 22], [1020, 562, 14],
      ]
      // Tree canopies: solid green with a lighter crown and a soft shadow, so they read clearly on the dark ground.
      const grove = ([x, y, r]) =>
        `<circle cx="${x + r * 0.12}" cy="${y + r * 0.2}" r="${r}" fill="#000" opacity=".22"/>` +
        `<circle cx="${x}" cy="${y}" r="${r}" fill="#3f9a4a"/>` +
        `<circle cx="${x - r * 0.22}" cy="${y - r * 0.24}" r="${r * 0.58}" fill="#6cc25a"/>`
      const RAIN = Array.from({ length: 70 }, (_, i) => [((i * 173) % 1200) - 20, ((i * 97) % 520) - 40, 0.2 + ((i * 37) % 10) / 20])

      function farmSvg() {
        const { farm } = D
        const T_ = t()
        const W = wide()
        const k = S.signK
        const texture = CROPS[farm.crop].texture
        const plans = farm.isToday ? D.byId : null
        const flagged = S.log.filter((e) => e.date === todayIso() && e.status === 'planned').map((e) => e.plot)

        const plots = farm.plots
          .map((src) => {
            const p = { ...src, ...LAYOUT[src.id] }
            const sel = S.selected === p.id
            const wet = S.flowing === p.id
            const look = plotLook(p)
            const compact = k > 1.15
            const main = S.layer === 'ndvi' ? fmt(p.ndvi, S.lang) : S.layer === 'drought' ? `${p.level + 1}/5` : `${p.moisture}%`
            const sub = S.layer === 'ndvi' ? `${T_.layers.moisture} ${p.moisture}%` : `NDVI ${fmt(p.ndvi, S.lang)}`
            // Every plot that needs water shows its chip at every size; on phones the unselected ones are short.
            const full = plans?.[p.id]
            const short = !W && !sel
            const pl = full && !(short && full.type === 'fine') ? full : null
            const action = pl
              ? pl.type === 'water'
                ? short
                  ? `${pl.minutes}′`
                  : `${hhmm(pl.start)} · ${pl.minutes}′`
                : T_.plotNeed[pl.type]
              : ''
            const cw = compact ? 132 : 176
            const ch = compact ? 44 : 60
            // Word pills ("No watering needed") grow with their text so it never runs past the pill.
            const aw = short && pl?.type === 'water' ? 84 : compact ? (pl && pl.type !== 'water' ? Math.max(150, Math.round(action.length * 9.5 + 26)) : 150) : Math.max(176, Math.round(action.length * 9 + 24))
            const actionFill = pl ? (pl.type === 'water' ? '#b8e55a' : pl.type === 'wait' ? '#8cc0e3' : '#ffffff') : ''
            const r = 26
            return `
              <g role="button" tabindex="0" data-plot="${p.id}" aria-pressed="${sel}" aria-label="${T_.plot} ${p.id}: ${p.moisture}% · NDVI ${fmt(p.ndvi, S.lang)} · ${T_.status[p.mStatus.key]}" class="cursor-pointer outline-none">
                ${sel ? `<rect x="${p.x - 7}" y="${p.y - 7}" width="${p.w + 14}" height="${p.h + 14}" rx="${r + 7}" fill="none" stroke="#b8e55a" stroke-width="5" filter="url(#glow)" class="sel-ring"/>` : ''}
                <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${r}" fill="${wet && S.layer === 'moisture' ? '#62c04a' : look.fill}" filter="url(#lift)" style="transition:fill .5s"/>
                <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${r}" fill="url(#${texture})"/>
                ${!wet && look.over ? `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${r}" fill="${look.over}"/>` : ''}
                <rect class="wet-overlay" data-wet="${p.id}" data-on="${wet && S.flowShown === p.id}" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${r}" fill="url(#sheen)"/>
                <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${r}" fill="url(#gloss)"/>
                <rect x="${p.x + 1.5}" y="${p.y + 1.5}" width="${p.w - 3}" height="${p.h - 3}" rx="${r - 1.5}" fill="none" stroke="#fff" stroke-opacity="${sel ? 0.55 : 0.28}" stroke-width="2"/>
                <g transform="translate(${p.x + (k > 1.6 ? 10 : 16)} ${p.y + (k > 1.6 ? 8 : 16)}) scale(${k})">
                  <rect x="0" y="4" width="${cw}" height="${ch}" rx="${ch / 2}" fill="#000" opacity=".18"/>
                  <rect width="${cw}" height="${ch}" rx="${ch / 2}" fill="#fff"/>
                  <circle cx="${ch / 2}" cy="${ch / 2}" r="${ch / 2 - 6}" fill="${sel ? '#b8e55a' : '#0b2e1b'}"/>
                  <text x="${ch / 2}" y="${ch / 2 + 6.5}" fill="${sel ? '#0b2e1b' : '#fff'}" font-size="${compact ? 17 : 19}" font-weight="800" text-anchor="middle">${p.id}</text>
                  <text x="${ch + 2}" y="${compact ? 30 : 29}" fill="#10231a" font-size="${compact ? 23 : 25}" font-weight="800" class="tabular">${main}</text>
                  ${compact ? '' : `<text x="${ch + 2}" y="48" fill="#5a6b61" font-size="14" font-weight="600" class="tabular">${sub}</text>`}
                  ${
                    pl
                      ? `<g transform="translate(0 ${ch + 8})"><rect width="${aw}" height="30" rx="15" fill="${actionFill}"/>${
                          pl.type === 'water' ? `<path d="M19 8c-3.5 4.4-5.2 7.3-5.2 9.2a5.2 5.2 0 0 0 10.4 0c0-1.9-1.7-4.8-5.2-9.2z" fill="#0b2e1b"/>` : ''
                        }<text x="${pl.type === 'water' ? 32 : aw / 2}" y="${short ? 21.5 : 20.5}" font-size="${short ? 18 : 15}" font-weight="800" fill="#0b2e1b" text-anchor="${pl.type === 'water' ? 'start' : 'middle'}" class="tabular">${action}</text></g>`
                      : ''
                  }
                </g>
                ${
                  flagged.includes(p.id)
                    ? `<g class="pop-in" transform="translate(${p.x + p.w - 30} ${p.y + p.h - 30})"><circle r="17" fill="#b8e55a" stroke="#0b2e1b" stroke-width="3"/><path d="M-7 0l4.5 4.5L7-5" fill="none" stroke="#0b2e1b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>`
                    : ''
                }
              </g>`
          })
          .join('')

        const flows = farm.plots
          .map(
            (p) =>
              `<g pointer-events="none"><path class="flow-path" data-flow="${p.id}" data-on="${S.flowing === p.id && S.flowShown === p.id}" d="${LAYOUT[p.id].flow}" fill="none" stroke="#8cc0e3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#waterGlow)"/>${
                S.flowing === p.id && S.flowShown === p.id ? `<path class="water-run" d="${LAYOUT[p.id].flow}" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 16"/>` : ''
              }</g>`,
          )
          .join('')

        const rain =
          farm.weather.rain48h >= 10
            ? `<g class="rain" pointer-events="none"><rect x="-1200" y="-200" width="3600" height="920" fill="#0b2e1b" opacity=".18"/>${RAIN.map(
                ([x, y, o]) => `<line x1="${x}" y1="${y}" x2="${x - 8}" y2="${y + 26}" stroke="#8cc0e3" stroke-width="2" stroke-linecap="round" opacity="${o}"/>`,
              ).join('')}</g>`
            : ''

        return `
          <svg id="farm-svg" viewBox="${W ? '0 0 1200 520' : '150 24 900 560'}" preserveAspectRatio="xMidYMid meet" class="block size-full" role="group" aria-label="${T_.mapTitle}">
            <defs>
              <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity=".09"/></pattern>
              <pattern id="rows" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)"><path d="M0 7H14" stroke="#0b2e1b" stroke-width="1.6" opacity=".16"/></pattern>
              <pattern id="trees" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="5.5" fill="#0b2e1b" opacity=".22"/><circle cx="23" cy="23" r="5.5" fill="#0b2e1b" opacity=".22"/></pattern>
              <pattern id="beds" width="22" height="18" patternUnits="userSpaceOnUse"><rect y="2" width="22" height="8" rx="4" fill="#0b2e1b" opacity=".16"/></pattern>
              <pattern id="drySparse" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="5" cy="6" r="1.7" fill="#5b4527" opacity=".45"/></pattern>
              <pattern id="dryDense" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#5b4527" opacity=".55"/><circle cx="8" cy="8" r="1.2" fill="#5b4527" opacity=".4"/></pattern>
              <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="12" fill="#fff" opacity=".3"/></pattern>
              <pattern id="sheen" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)"><rect width="46" height="46" fill="#2e86c1" opacity=".42"/><path d="M4 12h20M26 32h14" stroke="#dcecf7" stroke-width="2.5" stroke-linecap="round" opacity=".75"/></pattern>
              <linearGradient id="gloss" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>
              <linearGradient id="canal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b5a86"/><stop offset=".5" stop-color="#2e86c1"/><stop offset="1" stop-color="#1b5a86"/></linearGradient>
              <radialGradient id="vignette" cx=".5" cy=".45" r=".85"><stop offset=".7" stop-color="#0b2e1b" stop-opacity="0"/><stop offset="1" stop-color="#0b2e1b" stop-opacity=".35"/></radialGradient>
              <filter id="lift" x="-15%" y="-15%" width="130%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".38"/></filter>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              <filter id="waterGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>

            <rect x="-1200" y="-200" width="3600" height="920" fill="#0f3d24"/>
            <rect x="-1200" y="-200" width="3600" height="920" fill="url(#grid)"/>

            <!-- canal with a moving shimmer -->
            <rect x="-1200" y="42" width="3600" height="44" fill="url(#canal)"/>
            <path class="ripple" d="M-1200 56H2400" stroke="#8cc0e3" stroke-width="2.5" stroke-dasharray="36 84" stroke-linecap="round" opacity=".7"/>
            <path class="ripple" d="M-1240 72H2400" stroke="#dcecf7" stroke-width="2" stroke-dasharray="22 98" stroke-linecap="round" opacity=".55"/>
            <g transform="translate(${W ? 330 : 450} 64) scale(${W ? k : 2.2})"><rect x="${S.lang === 'vi' ? -58 : -82}" y="-14" width="${S.lang === 'vi' ? 116 : 164}" height="28" rx="14" fill="#0b2e1b" opacity=".85"/><text y="6" fill="#dcecf7" font-size="16" font-weight="700" text-anchor="middle">${T_.canal}</text></g>

            <!-- the farm parcel, the ditch from the gate, and the dike path -->
            <rect x="150" y="102" width="900" height="408" rx="36" fill="#155030" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>
            <rect x="595" y="86" width="10" height="410" rx="5" fill="#1b5a86" opacity=".75"/>
            <rect x="160" y="300" width="880" height="14" rx="7" fill="#ffffff" opacity=".05"/>
            ${GROVES.map(grove).join('')}

            ${flows}
            ${plots}

            <!-- the canal gate, labelled on a pill clear of the ditch -->
            <g transform="translate(600 92)"><circle r="11" fill="#b8e55a" stroke="#0b2e1b" stroke-width="3"/><rect x="-4" y="-4" width="8" height="8" rx="2" fill="#0b2e1b"/></g>
            <g transform="translate(${W ? (S.lang === 'vi' ? 552 : 548) : 720} ${W ? 92 : 64}) scale(${W ? k : 2.2})"><rect x="-38" y="-13" width="${S.lang === 'vi' ? 58 : 62}" height="26" rx="13" fill="#0b2e1b"/><text x="${S.lang === 'vi' ? -9 : -7}" y="5" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">${T_.gate}</text></g>

            ${rain}
            <rect x="-1200" y="-200" width="3600" height="920" fill="url(#vignette)" pointer-events="none"/>
          </svg>`
      }

      // Signs grow when the plan is drawn small so their text stays at 12px or more (on wide maps, the 15px action text sets the scale).
      function measureSigns() {
        const svg = $('#farm-svg')
        if (!svg) return
        const r = svg.getBoundingClientRect()
        const [vw, vh] = wide() ? [1200, 520] : [900, 560]
        const s = Math.min(r.width / vw, r.height / vh)
        if (!s) return
        const k = Math.min(wide() ? 1.45 : 2.1, Math.max(1, 12 / ((wide() ? 15 : 17) * s)))
        if (Math.abs(k - S.signK) > 0.02) {
          S.signK = k
          $('#farm').innerHTML = farmSvg()
        }
      }

      /* ================================================================
       * Dashboard section
       * ================================================================ */
      function renderDashboard() {
        const L_ = l()
        const T_ = t()
        $('#dashboard').innerHTML = `
          <div class="flex flex-wrap items-end justify-between gap-6" data-reveal>
            <div class="max-w-2xl">
              <h2 class="text-4xl font-extrabold tracking-tight sm:text-5xl">${L_.dashTitle}</h2>
              <p class="mt-3 text-lg leading-relaxed text-muted">${L_.dashSub}</p>
            </div>
            <div id="dash-controls" class="flex flex-wrap items-center gap-2"></div>
          </div>
          <div id="live-note" class="mt-4"></div>
          <div class="mt-8" data-reveal style="transition-delay:120ms">
            <div id="map-card"></div>
            <div id="readings" class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>
          </div>
          <div id="advice" class="mt-6"></div>`
        renderDashControls()
        renderLiveNote()
        renderMapCard()
        renderReadings()
        renderAdvice()
      }

      function renderDashControls() {
        const T_ = t()
        $('#dash-controls').innerHTML = `
          ${segmented('source', S.source, [
            { value: 'demo', label: T_.sourceDemo },
            { value: 'live', label: T_.sourceLive },
          ])}
          ${S.source === 'live' ? selectBox('province', T_.provinceLabel, S.provinceId, PROVINCES.map((p) => ({ value: p.id, label: p.name })), 'map-pin') : ''}
          ${selectBox('crop', T_.cropLabel, S.crop, CROP_IDS.map((c) => ({ value: c, label: T_.crops[c] })), 'sprout')}`
      }

      function renderLiveNote() {
        const T_ = t()
        const box = $('#live-note')
        if (S.source !== 'live') return (box.innerHTML = '')
        if (S.live.status === 'loading' && !S.live.data)
          return (box.innerHTML = `<p class="inline-flex items-center gap-2 rounded-full bg-white px-4 py-2 text-sm font-semibold text-moss-800 shadow-card">${icon('refresh-cw', 'size-4 animate-spin')}${T_.liveLoading}</p>`)
        if (S.live.status === 'error' || S.live.status === 'cached')
          return (box.innerHTML = `<p class="inline-flex flex-wrap items-center gap-2 rounded-full bg-sun-100 px-4 py-2 text-sm font-semibold text-sun-700">${
            S.live.status === 'error' ? T_.liveError : T_.liveCached(new Date(S.live.data.fetchedAt).toLocaleString(T_.locale))
          }<button type="button" data-action="retry" class="font-bold underline underline-offset-2">${T_.retry}</button></p>`)
        box.innerHTML = ''
      }

      const LEGEND = {
        moisture: [['#7ccf45'], ['#bfd154', 1], ['#dccb8c', 2]],
        ndvi: [['#3fae4a'], ['#9fd55a'], ['#dccb8c']],
        drought: [['#7ccf45'], ['#c9cf52'], ['#f2b134'], ['#e07b2a', 0, 1], ['#d9552f', 0, 1]],
      }

      // The water line starts empty and runs from the gate once per watering; later re-renders show it full.
      function runFlow() {
        if (!S.flowing) return (S.flowShown = null)
        if (S.flowShown === S.flowing) return
        const id = S.flowing
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            document.querySelectorAll(`[data-flow="${id}"],[data-wet="${id}"]`).forEach((el) => (el.dataset.on = 'true'))

          }),
        )
      }

      /* ================================================================

      const REASON_ICON = { drop: 'droplets', sun: 'sun', leaf: 'leaf', clock: 'calendar-clock', cloud: 'cloud-rain' }

      function timeline(plan) {
        const T_ = t()
        const from = 5 * 60
        const to = 23 * 60
        const pct = (m) => ((m - from) / (to - from)) * 100
        const bands = [
          [5, 7, '#fdf1d3'],
          [7, 11, '#eef4ef', T_.phases.day],
          [11, 15, '#f6ddd2', T_.phases.hot, true],
          [15, 17, '#eef4ef'],
          [17, 19, '#dcecf7'],
          [19, 23, '#dfe5ee', T_.phases.night],
        ]
        const s = plan.start
        const e = plan.start + plan.minutes
        return `
          <div class="relative h-7"><span class="tabular absolute bottom-1 -translate-x-1/2 whitespace-nowrap rounded-full bg-moss-900 px-2.5 py-0.5 text-xs font-bold text-white" style="left:${(pct(s) + pct(e)) / 2}%">${T_.phases.dusk} · ${plan.minutes}′</span></div>
          <div class="relative h-14 overflow-hidden rounded-2xl border border-line">
            ${bands
              .map(
                ([a, b, bg, label, hatch]) =>
                  `<div class="absolute inset-y-0" style="left:${pct(a * 60)}%;width:${pct(b * 60) - pct(a * 60)}%;background:${bg};${
                    hatch ? 'background-image:repeating-linear-gradient(135deg,#c4481f22 0 6px,transparent 6px 12px)' : ''
                  }">${label ? `<span class="absolute left-1.5 top-1.5 hidden whitespace-nowrap text-xs font-semibold text-muted sm:block">${label}</span>` : ''}</div>`,
              )
              .join('')}
            <div class="absolute inset-y-1.5 rounded-lg bg-moss-900" style="left:${pct(s)}%;width:${pct(e) - pct(s)}%"></div>
          </div>
          <div class="tabular relative mt-1.5 h-5 text-xs font-medium text-muted">${[6, 9, 12, 15, 18, 21]
            .map((h) => `<span class="absolute -translate-x-1/2" style="left:${pct(h * 60)}%">${h}:00</span>`)
            .join('')}</div>
          <p class="tabular mt-1 text-sm font-bold text-moss-800">${hhmm(s)} – ${hhmm(e)} · ${plan.minutes} ${T_.minutes}</p>`
      }

                      `<li class="flex gap-3 leading-relaxed"><span class="tabular grid size-7 shrink-0 place-items-center rounded-full bg-moss-900 text-sm font-bold text-lime-400">${i + 1}</span><span class="pt-0.5">${s}</span></li>`,
                  )
                  .join('')}</ol>
                ${plan.type === 'water' ? `<p class="mt-4 text-sm text-muted">${T_.waterMethod}: ${term(meth.term, GLOSSARY[S.lang][meth.term].title, 'text-ink')}</p>` : ''}
              </div>
              ${
                plan.type === 'water'
                  ? `<div class="space-y-7">
                <div><h3 class="text-lg font-extrabold">${T_.timeline}</h3><div class="mt-3">${timeline(plan)}</div></div>
                <div><h3 class="text-lg font-extrabold">${T_.waterTitle}</h3>
                  <div class="mt-3 space-y-2.5">${[
                    [GLOSSARY[S.lang][meth.term].title, plan.m3, 'bg-water-500'],
                    [T_.waterFlood, plan.flood, 'bg-[#c8ad8a]'],
                  ]
                    .map(
                      ([label, v, cls]) =>
                        `<div class="grid grid-cols-[7.5rem_1fr_3.5rem] items-center gap-3 text-sm"><span class="font-semibold text-muted">${label}</span><span class="h-2.5 rounded-full bg-moss-50"><span class="block h-full rounded-full ${cls}" style="width:${(v / plan.flood) * 100}%"></span></span><span class="tabular text-right font-bold">${v} m³</span></div>`,
                    )
                    .join('')}</div>
                  <p class="mt-2 text-sm font-bold text-moss-700">≈ ${Math.round((1 - plan.m3 / plan.flood) * 100)}% ${T_.saved}</p>
                </div>
                <div class="flex flex-wrap items-center gap-3 border-t border-line pt-5">${
                  scheduled
                    ? `<span role="status" class="inline-flex items-center gap-2 rounded-full bg-lime-100 px-4 py-2.5 font-bold text-moss-900">${icon('check', 'size-5')}${T_.scheduled(hhmm(plan.start), plan.plot.id)}</span><button type="button" data-action="unschedule" class="inline-flex items-center gap-1.5 rounded-full px-3 py-2 text-sm font-bold text-muted hover:bg-moss-50 hover:text-ink">${icon('undo-2', 'size-4')}${T_.undo}</button>`

                }</div>
              </div>`
                  : ''
              }
            </div>
          </article>`
      }

      /* ================================================================
       * Weather section (dark)
       * ================================================================ */
      /* The week just measured and the week ahead on one clean chart.
         Soil moisture bars (lime = below what the crop needs), the need line, forecast rain bars,
         weather icons and highs on top, dates and NDVI values in their own rows underneath.
         Nothing is drawn on top of anything else. */
      function weekChart() {
        const T_ = t()
        const { farm } = D
        const forecast = D.realToday.forecast
        const W = wide()
        const Wd = W ? 1040 : 340
        const fs = W ? 14 : 13
        const pad = { l: W ? 52 : 40, r: W ? 16 : 8, t: W ? 80 : 66, b: W ? 70 : 64 }
        const ih = W ? 220 : 190
        const H = pad.t + ih + pad.b
        const past = farm.days.length
        const future = forecast?.length ?? 0
        const n = past + future
        const iw = Wd - pad.l - pad.r
        const slot = iw / n
        const bw = slot * (W ? 0.56 : 0.62)
        const cx = (i) => pad.l + slot * (i + 0.5)
        const max = farm.unit === 'sat' ? 100 : 60
        const ticks = farm.unit === 'sat' ? [0, 50, 100] : [0, 20, 40, 60]
        const ym = (v) => pad.t + ih - (Math.min(v, max) / max) * ih
        // Rain bars scale to the wettest day and stop 26 units below the top, so their labels stay inside the chart.
        const rainMax = Math.max(20, ...(forecast || []).map((d) => d.rain))
        const yr = (mm) => pad.t + ih - (Math.min(mm, rainMax) / rainMax) * (ih - 26)
        const { moisture, ndvi } = farm.history
        const divider = pad.l + slot * past
        const every = W ? 1 : 2
        const yDate = pad.t + ih + 26
        const yNdvi = pad.t + ih + 54
        const glyph = (d) => (d.rain >= 10 ? 'cloud-rain' : d.rain >= 1 ? 'cloud-drizzle' : d.prob >= 40 ? 'cloud' : 'sun')
        const g = W ? 24 : 18
        const svgIcon = (name, x, y, color) => (ICONS[name] || '').replace('<svg ', `<svg x="${x}" y="${y}" width="${g}" height="${g}" color="${color}" `)
        const dayText = (iso, i) => {
          if (i === past - 1 && D.eff !== 'live') return W ? T_.today : new Date(`${iso}T00:00:00`).getDate()
          return W ? shortDate(iso) : new Date(`${iso}T00:00:00`).getDate()
        }
        return `
          <svg viewBox="0 0 ${Wd} ${H}" class="w-full" role="img" aria-label="${L[S.lang].wxTitle}">
            <!-- day being viewed (time-lapse), and the forecast side on a faint water wash -->
            <rect x="${cx(farm.dayIndex) - slot / 2}" y="${pad.t - 6}" width="${slot}" height="${ih + 44}" rx="10" fill="#ffffff" opacity=".07"/>
            ${future ? `<rect x="${divider}" y="${pad.t - 6}" width="${slot * future}" height="${ih + 6}" rx="10" fill="#2e86c1" opacity=".12"/>` : ''}

            <!-- section labels -->

            ${future ? `<text x="${divider + 10}" y="18" font-size="${fs}" font-weight="800" fill="#8cc0e3">${T_.forecastTitle}</text>` : ''}

                return `<rect x="${cx(i) - bw / 2}" y="${ym(v)}" width="${bw}" height="${ym(0) - ym(v)}" rx="7" fill="${low ? '#b8e55a' : '#5fae52'}"/>${

                }`

            <line x1="${pad.l}" x2="${divider}" y1="${ym(farm.need)}" y2="${ym(farm.need)}" stroke="#fdf1d3" stroke-width="2.5" stroke-dasharray="7 6"/>

            <!-- today divider -->

                      ? `<rect x="${cx(i) - bw / 2}" y="${yr(d.rain)}" width="${bw}" height="${yr(0) - yr(d.rain)}" rx="7" fill="#8cc0e3"/><text x="${cx(i)}" y="${yr(d.rain) - 8}" font-size="${fs}" font-weight="800" fill="#dcecf7" text-anchor="middle" class="tabular">${d.rain}</text>`
                      : ''
                  }`
              })
              .join('')}
            <line x1="${pad.l}" x2="${Wd - pad.r}" y1="${ym(0)}" y2="${ym(0)}" stroke="#ffffff" opacity=".3"/>

            <!-- rows under the chart: dates, then NDVI for the measured days -->
            ${farm.days
              .map((iso, i) =>
                i % every === (past - 1) % every
                  ? `<text x="${cx(i)}" y="${yDate}" font-size="${fs}" font-weight="${i === farm.dayIndex ? 800 : 500}" fill="${i === farm.dayIndex ? '#ffffff' : '#ffffffb3'}" text-anchor="middle" class="tabular">${dayText(iso, i)}</text>`

            ${(forecast || [])
              .map((d, k) =>

                  ? `<text x="${cx(past + k)}" y="${yDate}" font-size="${fs}" font-weight="500" fill="#ffffffb3" text-anchor="middle" class="tabular">${W ? shortDate(d.date) : new Date(`${d.date}T00:00:00`).getDate()}</text>`
                  : '',
              )
              .join('')}
            <text x="${pad.l - 8}" y="${yNdvi}" font-size="${fs - 1}" font-weight="800" fill="#cff08a" text-anchor="end">NDVI</text>
            ${ndvi
              .map((v, i) =>

          root.innerHTML = ''
          document.body.style.overflow = ''
          return
        }
        document.body.style.overflow = 'hidden'
        if (S.dialog === 'share') renderShare(root)
        else renderAssistant(root)
      }

      function renderShare(root) {
        const T_ = t()
        const { plan, text } = D
        const footer = D.eff === 'live' ? T_.cardFooterLive(shortDate(D.nowFarm.dataDate)) : T_.cardFooterDemo
        root.innerHTML = `
          <div class="scrim-in fixed inset-0 z-50 grid place-items-center overflow-y-auto bg-moss-950/60 p-4" data-scrim>
            <div role="dialog" aria-modal="true" aria-labelledby="share-title" class="panel-in w-full max-w-2xl rounded-[28px] bg-ground p-5 shadow-lift sm:p-7">
              <div class="flex items-center justify-between gap-3"><h2 id="share-title" class="text-2xl font-extrabold tracking-tight">${T_.shareTitle}</h2><button type="button" data-action="close-dialog" aria-label="${T_.close}" class="rounded-full p-2 text-muted hover:bg-white hover:text-ink">${icon('x', 'size-5')}</button></div>
              <div class="mt-5 grid gap-5 sm:grid-cols-[1fr_auto]">
                <article id="print-card" class="rounded-3xl bg-white p-6 shadow-card">
                  <div class="flex items-center gap-2.5"><span class="grid size-8 place-items-center rounded-full bg-lime-400 text-moss-950">${icon('sprout', 'size-4')}</span><span class="text-sm font-extrabold">NASA Adapting Farms</span></div>
                  <p class="mt-4 text-xl font-extrabold leading-snug tracking-tight text-moss-900">${text.headline}</p>
                  <p class="mt-2 text-sm leading-relaxed">${text.summary}</p>
                  <ol class="mt-3 space-y-1.5 text-sm">${text.steps.map((s, i) => `<li class="flex gap-2"><span class="tabular font-bold text-moss-700">${i + 1}.</span><span>${s}</span></li>`).join('')}</ol>
                  ${plan.type === 'water' ? `<p class="tabular mt-4 rounded-full bg-lime-100 px-4 py-2 text-sm font-bold text-moss-900">${plan.minutes} ${T_.minutes} · ${plan.m3} m³ · ≈ ${Math.round((1 - plan.m3 / plan.flood) * 100)}% ${T_.saved}</p>` : ''}
                  <p class="mt-4 text-xs font-bold ${D.eff === 'live' ? 'text-moss-700' : 'text-sun-700'}">${footer}</p>
                  <p class="mt-1 text-xs text-muted">${T_.footer}</p>
                </article>
                <div id="qr-box" class="flex flex-col items-center gap-2 rounded-3xl bg-white p-5 text-center shadow-card sm:w-60">
                  <p class="text-sm font-extrabold">${T_.qrTitle}</p>
                  ${served ? '<div class="size-44 animate-pulse rounded-2xl bg-moss-50"></div>' : `<p class="text-xs leading-relaxed text-muted">${L[S.lang].servedOnly}</p>`}
                </div>
              </div>
              <div class="mt-6 flex flex-wrap gap-2">
                ${pillBtn(`${icon('printer', 'size-4')}${T_.print}`, 'data-action="print"', 'dark')}
                ${pillBtn(`${icon('copy', 'size-4')}<span id="copy-label">${T_.copy}</span>`, 'data-action="copy"', 'ghost')}
                ${navigator.share ? pillBtn(`${icon('send', 'size-4')}${T_.sendNative}`, 'data-action="native-share"', 'ghost') : ''}
              </div>
            </div>
          </div>`
        root.querySelector('[data-action="close-dialog"]').focus()
        if (served) {
          fetch('/api/lan-qr')
            .then((r) => (r.ok ? r.json() : Promise.reject()))
            .then(({ url, svg }) => {
              const box = $('#qr-box')
              if (box) box.innerHTML = `<p class="text-sm font-extrabold">${T_.qrTitle}</p><div class="w-44 [&>svg]:h-auto [&>svg]:w-full">${svg}</div><p class="tabular break-all text-xs text-muted">${esc(url)}</p><p class="text-xs text-muted">${T_.qrHint}</p>`
            })
            .catch(() => {
              const box = $('#qr-box')
              if (box) box.innerHTML = `<p class="text-sm font-extrabold">${T_.qrTitle}</p><p class="text-xs leading-relaxed text-muted">${T_.qrUnavailable}</p>`
            })
        }
      }

      function shareText() {
        const T_ = t()
        const footer = D.eff === 'live' ? T_.cardFooterLive(shortDate(D.nowFarm.dataDate)) : T_.cardFooterDemo
        return [D.text.headline, '', D.text.summary, '', ...D.text.steps.map((s, i) => `${i + 1}. ${s}`), '', `NASA Adapting Farms · ${footer}`, T_.footer].join('\n')
      }

      function renderAssistant(root) {
        const T_ = t()
        const msgs = S.chat
          .map((m) =>
            m.role === 'user'
              ? `<p class="ml-auto w-fit max-w-[85%] rounded-3xl rounded-br-lg bg-moss-900 px-4 py-2.5 text-[15px] leading-relaxed text-white">${esc(m.text)}</p>`
              : `<div class="max-w-[92%] rounded-3xl rounded-bl-lg border border-line bg-white px-4 py-3 shadow-card"><p class="whitespace-pre-wrap text-[15px] leading-relaxed">${m.text ? esc(m.text).replace(/\*\*(.+?)\*\*/g, '<strong class="font-extrabold">$1</strong>').replace(/^\s*[*-] /gm, '• ') : `<span class="text-muted">${T_.answering}</span>`}${
                  m.pending && m.text ? '<span class="ml-0.5 inline-block h-4 w-1.5 animate-pulse rounded-sm bg-lime-500 align-middle"></span>' : ''
                }</p>${!m.pending ? `<p class="mt-2 flex items-center gap-1 text-xs font-bold text-muted">${icon('sparkles', 'size-3.5')}${m.source === 'ai' ? T_.aiAnswer : T_.sampleAnswer}</p>` : ''}</div>`,
          )
          .join('')
        const existing = $('#chat-list')
        if (existing) {
          existing.innerHTML = msgs || suggestions()
          existing.scrollTop = existing.scrollHeight
          $('#chat-send').disabled = S.busy
          return
        }
        root.innerHTML = `
          <div class="scrim-in fixed inset-0 z-50 flex justify-end bg-moss-950/40" data-scrim>
            <aside role="dialog" aria-modal="true" aria-labelledby="assistant-title" class="drawer-in flex h-dvh w-full flex-col bg-ground shadow-lift sm:w-[440px] sm:rounded-l-[32px]">
              <header class="flex items-center justify-between gap-3 px-6 py-5">
                <h2 id="assistant-title" class="flex items-center gap-3 text-lg font-extrabold"><span class="grid size-10 place-items-center rounded-full bg-lime-400 text-moss-950">${icon('bot', 'size-5')}</span>${T_.assistantTitle}</h2>
                <button type="button" data-action="close-dialog" aria-label="${T_.close}" class="rounded-full p-2 text-muted hover:bg-white hover:text-ink">${icon('x', 'size-5')}</button>
              </header>
              <div id="chat-list" class="flex-1 space-y-3 overflow-y-auto px-6 pb-4" aria-live="polite">${msgs || suggestions()}</div>
              <form id="chat-form" class="flex items-end gap-2 border-t border-line bg-white px-4 py-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
                <label for="chat-input" class="sr-only">${T_.placeholder}</label>
                <textarea id="chat-input" rows="1" maxlength="600" placeholder="${T_.placeholder}" class="max-h-32 min-h-12 flex-1 resize-none rounded-3xl border border-line bg-ground px-4 py-3 text-[15px] outline-none placeholder:text-muted focus:border-moss-700"></textarea>
                <button id="chat-send" type="submit" aria-label="${T_.send}" class="grid size-12 shrink-0 place-items-center rounded-full bg-lime-400 text-moss-950 transition-colors hover:bg-lime-300 disabled:bg-line">${icon('send-horizontal', 'size-5')}</button>
              </form>
            </aside>
          </div>`
        $('#chat-input').focus()
      }
      const suggestions = () => {
        const T_ = t()
        return `<p class="leading-relaxed text-muted">${T_.assistantIntro}</p><div class="mt-4 flex flex-col items-start gap-2">${T_.suggestions
          .map((s) => `<button type="button" data-action="ask" data-value="${esc(s)}" class="rounded-full border border-line bg-white px-4 py-2 text-left text-sm font-bold text-moss-900 transition-colors hover:border-moss-700">${esc(s)}</button>`)
          .join('')}</div>`
      }

      async function ask(q) {
        q = q.trim()
        if (!q || S.busy) return
        S.busy = true
        const history = [...S.chat, { role: 'user', text: q }]
        S.chat = [...history, { role: 'model', text: '', source: 'ai', pending: true }]
        renderOverlay()
        const last = () => S.chat[S.chat.length - 1]
        let answer = null
        if (served) {
          try {
            const res = await fetch('/api/assistant', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                lang: S.lang,
                context: assistantContext({ farm: D.nowFarm, plans: D.plans, source: D.eff, provinceName: PROVINCES.find((p) => p.id === S.provinceId).name }),
                messages: history.slice(-10).map((m) => ({ role: m.role, text: m.text })),
              }),
            })
            if (res.ok && res.body) {
              const reader = res.body.getReader()
              const dec = new TextDecoder()
              let text = ''
              for (;;) {
                const { done, value } = await reader.read()
                if (done) break
                text += dec.decode(value, { stream: true })
                last().text = text
                renderOverlay()
              }
              answer = text.trim() || null
            }
          } catch {
            answer = null
          }
        }
        Object.assign(last(), answer ? { text: answer, pending: false } : { text: fallbackAnswer(q, { farm: D.nowFarm, plans: D.plans, selectedText: D.text }, S.lang), source: 'sample', pending: false })
        S.busy = false
        renderOverlay()
      }

      /* ================================================================
       * Render orchestration
       * ================================================================ */
      function renderAll() {
        D = derive()
        document.documentElement.lang = S.lang
        renderNav()
        renderHero()
        renderHeroChip()
        renderStats()
        renderMission()
        renderDashboard()
        renderSolutions()
        renderWeather()
        renderWater()
        renderStories()
        renderCta()
        renderFooter()
        renderFloating()
        renderOverlay()
        closeTerm()
        wireMotion()
      }

      // Updates what depends on farm numbers, leaving the sliders being dragged untouched.
      function renderLive({ sliders = false } = {}) {
        D = derive()
        renderHeroChip()
        renderLiveNote()
        renderMapCard()
        renderReadings()
        renderAdvice()
        $('#week-chart').innerHTML = weekChart()
        const wi = $('#whatif')
        wi.classList.toggle('outline-2', D.farm.whatIf)
        wi.classList.toggle('outline-dashed', D.farm.whatIf)
        wi.classList.toggle('outline-sun-400', D.farm.whatIf)
        if (sliders) renderWhatIf()
        else renderWhatIfResult()
        renderWater()
        renderFloating()
        revealNow('#water [data-reveal]')
      }
      const revealNow = (sel) => document.querySelectorAll(sel).forEach((el) => el.classList.add('is-in'))

      /* ================================================================
       * Actions
       * ================================================================ */
      let playTimer = null
      let flowTimer = null
      const persist = () => {
        store.set('naf-lang', S.lang)
        store.set('naf-source', S.source)
        store.set('naf-province', S.provinceId)
        store.set('naf-crop', S.crop)
        store.set('naf-log', S.log)
      }

      function resetView() {
        S.scenario = null
        S.preset = null
        S.day = null
        stopPlay()
      }
      function stopPlay() {
        S.playing = false
        clearInterval(playTimer)
      }

      function openAdvice(plotId = S.selected) {
        clearTimeout(flowTimer)
        stopPlay()
        S.day = null
        S.selected = plotId
        D = derive()
        const p = D.byId[plotId]
        S.showAdvice = false
        S.flowing = p.type === 'water' ? plotId : null
        renderLive()
        document.getElementById('dashboard').scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' })
        flowTimer = setTimeout(
          () => {
            S.showAdvice = true
            renderAdvice()
            renderReadings()
            const panel = $('#advice-panel')
            panel?.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' })
            panel?.focus({ preventScroll: true })
          },
          reduced() || p.type !== 'water' ? 60 : 900,
        )
      }

      async function loadLive() {
        const province = PROVINCES.find((p) => p.id === S.provinceId)
        const cached = readCachedLive(province.id)
        S.live = { status: 'loading', data: cached }
        renderLive({ sliders: true })
        try {
          S.live = { status: 'ok', data: await fetchLive(province) }
        } catch {
          S.live = { status: cached ? 'cached' : 'error', data: cached }
        }
        resetView()
        renderAll()
      }

      function solution(key) {
        const go = (id) => document.getElementById(id).scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' })
        if (key === 'plot') go('dashboard')
        if (key === 'whatif') go('whatif')
        if (key === 'water') go('water')
        if (key === 'share') ((S.dialog = 'share'), renderOverlay())
        if (key === 'assistant') ((S.dialog = 'assistant'), renderOverlay())
        if (key === 'replay') {
          go('dashboard')
          setTimeout(togglePlay, reduced() ? 0 : 700)
        }
      }

      function togglePlay() {
        if (S.playing) {
          stopPlay()
          return renderMapCard()
        }
        S.scenario = null
        S.preset = null
        S.showAdvice = false
        S.flowing = null
        S.day = 0
        S.playing = true
        renderLive({ sliders: true })
        playTimer = setInterval(() => {
          const last = D.farm.days.length - 1
          const next = (S.day ?? -1) + 1
          if (next >= last) {
            S.day = null
            stopPlay()
          } else S.day = next
          renderLive()
        }, 750)
      }

      document.addEventListener('click', (e) => {
        const termBtn = e.target.closest('[data-term]')
        if (termBtn) {
          e.preventDefault()
          return openTerm(termBtn)
        }
        if (openTermEl && !e.target.closest('#term-pop')) closeTerm()
        if (e.target.matches('[data-scrim]')) {
          S.dialog = null
          return renderOverlay()
        }
        const plot = e.target.closest('[data-plot]')
        if (plot) return selectPlot(plot.dataset.plot)
        const a = e.target.closest('[data-action]')
        if (!a) return
        const v = a.dataset.value
        switch (a.dataset.action) {
          case 'lang':
            S.lang = v
            persist()
            return renderAll()
          case 'source':
            S.source = v
            persist()
            resetView()
            if (v === 'live') return loadLive()
            return renderAll()
          case 'layer':
            S.layer = v
            return renderMapCard()
          case 'goto':
            return document.getElementById(v).scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth' })
          case 'open-advice':
            return openAdvice(v || S.selected)
          case 'close-advice':
            S.showAdvice = false
            S.flowing = null
            return renderLive()
          case 'schedule':
            S.log = [...S.log, { id: `u${Date.now()}`, date: todayIso(), plot: D.plan.plot.id, minutes: D.plan.minutes, m3: D.plan.m3, flood: D.plan.flood, status: 'planned' }]
            persist()
            return renderLive()
          case 'unschedule':
            S.log = S.log.filter((x) => !(x.date === todayIso() && x.plot === D.plan.plot.id && x.status === 'planned'))
            persist()
            return renderLive()
          case 'done':
            S.log = S.log.map((x) => (x.id === v ? { ...x, status: 'done' } : x))
            persist()
            return renderLive()
          case 'play':
            return togglePlay()
          case 'today':
            stopPlay()
            S.day = null
            return renderLive()
          case 'preset': {
            const base = { moisture: D.realToday.avg.moisture, dryDays: D.realToday.weather.dryDays, rain48h: D.realToday.weather.rain48h, tMax: D.realToday.weather.tMax }
            stopPlay()
            S.day = null
            S.scenario = presetValues(base, D.farm.need)[v]
            S.preset = v
            return renderLive({ sliders: true })
          }
          case 'clear-sim':
            S.scenario = null
            S.preset = null
            return renderLive({ sliders: true })
          case 'carousel': {
            const c = $('#carousel')
            return c.scrollBy({ left: Number(v) * (c.firstElementChild.offsetWidth + 20), behavior: reduced() ? 'auto' : 'smooth' })
          }
          case 'solution':
            return solution(v)
          case 'share':
            S.dialog = 'share'
            return renderOverlay()
          case 'assistant':
            S.dialog = 'assistant'
            return renderOverlay()
          case 'close-dialog':
            S.dialog = null
            return renderOverlay()
          case 'close-term':
            return closeTerm()
          case 'print':
            return window.print()
          case 'copy':
            return navigator.clipboard?.writeText(shareText()).then(() => {
              const l_ = $('#copy-label')
              if (l_) l_.textContent = t().copied
            })
          case 'native-share':
            return navigator.share({ title: 'NASA Adapting Farms', text: shareText() }).catch(() => {})
          case 'ask':
            return ask(v)
          case 'retry':
            return loadLive()
        }
      })

      function selectPlot(id) {
        S.selected = id
        if (S.showAdvice) {
          D = derive()
          S.flowing = D.byId[id].type === 'water' ? id : null
        }
        renderLive()
      }

      document.addEventListener('keydown', (e) => {
        const plot = e.target.closest?.('[data-plot]')
        if (plot && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault()
          return selectPlot(plot.dataset.plot)
        }
        if (e.key !== 'Escape') return
        if (openTermEl) return closeTerm()
        if (S.dialog) {
          S.dialog = null
          return renderOverlay()
        }
        if (S.showAdvice) {
          S.showAdvice = false
          S.flowing = null
          renderLive()
        }
      })

      document.addEventListener('change', (e) => {
        const sel = e.target.closest('[data-select]')
        if (!sel) return
        if (sel.dataset.select === 'crop') {
          S.crop = sel.value
          persist()
          resetView()
          return renderAll()
        }
        if (sel.dataset.select === 'province') {
          S.provinceId = sel.value
          persist()
          return loadLive()
        }
      })

      document.addEventListener('input', (e) => {
        if (e.target.id === 'day-slider') {
          const last = D.farm.days.length - 1
          const v = Number(e.target.value)
          stopPlay()
          S.scenario = null
          S.preset = null
          S.day = v === last ? null : v
          return renderLive({ sliders: true })
        }
        const key = e.target.dataset?.sim
        if (!key) return
        const base = { moisture: D.realToday.avg.moisture, dryDays: D.realToday.weather.dryDays, rain48h: D.realToday.weather.rain48h, tMax: D.realToday.weather.tMax }
        const value = Number(e.target.value)
        stopPlay()
        S.day = null
        S.scenario = { ...(S.scenario ?? base), [key]: value }
        if (S.preset) {
          S.preset = null
          document.querySelectorAll('[data-action="preset"]').forEach((b) => b.setAttribute('aria-pressed', 'false'))
        }
        const min = Number(e.target.min)
        const max = Number(e.target.max)
        e.target.style.setProperty('--fill', `${((value - min) / (max - min)) * 100}%`)
        $(`#out-${key}`).innerHTML = `${value} <span class="text-sm font-bold text-white/60">${e.target.dataset.unit}</span>`
        renderLive()
      })

      document.addEventListener('submit', (e) => {
        if (e.target.id !== 'chat-form') return
        e.preventDefault()
        const input = $('#chat-input')
        const q = input.value
        input.value = ''
        ask(q)
      })
      document.addEventListener('keydown', (e) => {
        if (e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          $('#chat-form').requestSubmit()
        }
      })

      /* ================================================================
       * Motion: reveal on scroll, count-ups, the statement, the nav
       * ================================================================ */
      const io = new IntersectionObserver(
        (entries) => {
          for (const en of entries) {
            if (!en.isIntersecting) continue
            en.target.classList.add('is-in')
            en.target.querySelectorAll('[data-count]').forEach(countUp)
            io.unobserve(en.target)
          }
        },
        { threshold: 0.12, rootMargin: '0px 0px -40px 0px' },
      )
      function wireMotion() {
        document.querySelectorAll('[data-reveal]:not(.is-in)').forEach((el) => {
          if (reduced()) {
            el.classList.add('is-in')
            el.querySelectorAll('[data-count]').forEach(countUp)
          } else io.observe(el)
        })
        onScroll()
      }
      function countUp(el) {
        if (el.dataset.done) return
        el.dataset.done = '1'
        const target = Number(el.dataset.count)
        if (reduced()) return (el.textContent = target)
        const t0 = performance.now()
        const step = (now) => {
          const k = Math.min(1, (now - t0) / 1400)
          el.textContent = Math.round(target * (1 - Math.pow(1 - k, 4)))
          if (k < 1) requestAnimationFrame(step)
        }
        requestAnimationFrame(step)
      }
      let ticking = false
      function onScroll() {
        if (ticking) return
        ticking = true
        requestAnimationFrame(() => {
          ticking = false
          $('#nav').dataset.solid = String(scrollY > 40)
          const p = $('[data-mission]')
          if (!p) return
          const words = p.querySelectorAll('.word')
          if (reduced()) return words.forEach((w) => w.classList.add('lit'))
          const r = p.getBoundingClientRect()
          const progress = Math.min(1, Math.max(0, (innerHeight * 0.85 - r.top) / (r.height + innerHeight * 0.35)))
          const lit = Math.round(progress * words.length)
          words.forEach((w, i) => w.classList.toggle('lit', i < lit))
        })
      }
      addEventListener('scroll', onScroll, { passive: true })
      let resizeTimer
      addEventListener('resize', () => {
        clearTimeout(resizeTimer)
        resizeTimer = setTimeout(() => {
          renderMapCard()
          $('#week-chart').innerHTML = weekChart()
          closeTerm()
        }, 150)
      })

      /* ================================================================
       * Start
       * ================================================================ */
      renderAll()
      requestAnimationFrame(() => revealNow('#hero [data-reveal]'))
      if (S.source === 'live') loadLive()
      if (location.hash === '#advice') openAdvice('B')
    </script>
  </body>
</html>
