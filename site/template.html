        const idle = dark ? 'text-white/80 hover:text-white' : 'text-muted hover:text-ink'
        return `<div role="group" class="flex rounded-full border p-1 ${shell}">${options
          .map(
            (o) =>
              `<button type="button" data-action="${name}" data-value="${o.value}" aria-pressed="${value === o.value}" class="whitespace-nowrap rounded-full font-bold transition-colors duration-300 ${pad} ${idle} aria-pressed:bg-moss-900 aria-pressed:text-white">${o.label}</button>`,
          )
          .join('')}</div>`
      }

      function selectBox(name, label, value, options, iconName) {
        return `<label class="relative flex items-center rounded-full border border-line bg-white transition-colors focus-within:border-moss-700 hover:border-moss-700">

          ${icon(iconName, 'pointer-events-none absolute left-3.5 size-4 text-moss-700')}
          <select data-select="${name}" class="appearance-none rounded-full bg-transparent py-2 pl-10 pr-9 text-sm font-bold text-ink outline-none">
            ${options.map((o) => `<option value="${o.value}" ${o.value === value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}
          </select>
          ${icon('chevron-down', 'pointer-events-none absolute right-3 size-4 text-muted')}
        </label>`
      }

      const TONE = {
        good: ['bg-lime-100 text-moss-900', 'check'],
        warn: ['bg-sun-100 text-sun-700', 'triangle-alert'],
        bad: ['bg-clay-100 text-clay-700', 'circle-alert'],
      }
      // shrink-0 + nowrap: a badge never gets squeezed or split across lines by long text next to it.
      const badge = (tone, text) => `<span class="inline-flex shrink-0 items-center gap-1 whitespace-nowrap rounded-full px-3 py-1 text-sm font-bold ${TONE[tone][0]}">${icon(TONE[tone][1], 'size-4')}${text}</span>`

      const whatIfTag = () =>
        `<span class="rounded-full border border-dashed border-sun-400 bg-sun-100 px-2.5 py-0.5 text-xs font-bold text-sun-700">${t().whatIfTag}</span>`

      /* ================================================================
       * Pages (router): one file, several pages.
       * "#/luan-canh" opens a whole page and scrolls to its top.
       * "#dashboard" (a plain element id) opens the page that holds that element and scrolls to it.
       * ================================================================ */
      // Phase 4: xoá 2 trang 4 thửa mô phỏng cũ ("Ruộng hôm nay", "Thời tiết"); địa chỉ cũ tự mở sang "Ruộng của tôi".
      const PAGES = [
        { id: 'home', slug: '', nav: 'navHome', icon: 'house' },
        { id: 'myfield', slug: 'ruong-cua-toi', aliases: ['vuon-cua-toi', 'ruong-hom-nay', 'thoi-tiet'], nav: 'navMyField', icon: 'map-pin' },
        { id: 'rotations', slug: 'luan-canh', nav: 'navRotations', icon: 'refresh-cw' },
        // Prompt 03: dải chip thuật ngữ trên trang Luân canh chuyển thành một trang riêng.
        { id: 'glossary', slug: 'thuat-ngu', aliases: ['glossary'], nav: 'navGlossary', icon: 'book-open' },
      ]
      const menuPages = () => PAGES.filter((p) => p.menu !== false)
      const pageHref = (id) => `#/${PAGES.find((p) => p.id === id).slug}`

      function triggerPageFadeIn(id) {
        const pageEl = document.querySelector(`[data-page="${id}"]`)
        if (!pageEl) return
        pageEl.classList.remove('mk-page-fade-in')
        void pageEl.offsetWidth
        pageEl.classList.add('mk-page-fade-in')
      }

      function runTabTransition(id) {
        const loader = $('#mk-loader')
        if (!loader || reduced()) {
          triggerPageFadeIn(id)
          return
        }
        clearTimeout(tabTransTimer)
        cancelAnimationFrame(tabTransRaf)

        const pageEl = document.querySelector(`[data-page="${id}"]`)
        if (pageEl) pageEl.classList.remove('mk-page-fade-in')

        loader.dataset.fast = 'true'
        loader.dataset.done = 'false'

        const setFastP = (p) => {
          const clamp = (v) => Math.max(0, Math.min(1, v))
          loader.style.setProperty('--load-p', p.toFixed(3))
          loader.style.setProperty('--soil-p', clamp(p / 0.25).toFixed(3))
          loader.style.setProperty('--stem-p', clamp((p - 0.14) / 0.42).toFixed(3))
          loader.style.setProperty('--leaf-l-p', clamp((p - 0.46) / 0.36).toFixed(3))
          loader.style.setProperty('--leaf-r-p', clamp((p - 0.56) / 0.44).toFixed(3))
        }

        delete loader.dataset.watering
        const t0 = performance.now()
        const tickFast = (now) => {
          const p = Math.min(1, (now - t0) / 100)
          setFastP(p)
          if (p < 1) tabTransRaf = requestAnimationFrame(tickFast)
        }
        tabTransRaf = requestAnimationFrame(tickFast)

        tabTransTimer = setTimeout(() => {
          cancelAnimationFrame(tabTransRaf)
          setFastP(1)
          loader.dataset.done = 'true'
          delete loader.dataset.watering
          delete loader.dataset.fast
          triggerPageFadeIn(id)
        }, 100)
      }

      // Hiện đúng một trang, cập nhật menu, tiêu đề tab và nền thanh menu.
      function showPage(id) {
        const changed = S.page !== id
        S.page = id
        document.body.dataset.view = id
        S.menuOpen = false
        document.querySelectorAll('[data-page]').forEach((el) => (el.hidden = el.dataset.page !== id))
        const page = PAGES.find((p) => p.id === id)
        document.title = id === 'home' ? `${appName()} · ${l().heroTitle}` : `${l()[page.nav]} · ${appName()}`
        renderNav()
        renderFooter() // đánh dấu trang đang mở ở menu chân trang
        $('#footer').hidden = id === 'myfield'
        $('#mobilebar').hidden = id === 'myfield'
        $('#fab').classList.toggle('bottom-12', id === 'myfield')
        $('#fab').classList.toggle('bottom-6', id !== 'myfield')
        $('#fab').hidden = id === 'myfield' && Boolean(typeof MW !== 'undefined' && MW.layersOpen)
        $('#nav').dataset.solid = String(id !== 'home' || scrollY > 40)
        if (changed) closeTerm()
        if (id === 'myfield') myFieldOnShow() // bản đồ Leaflet chỉ khởi tạo được khi khung đang hiện (site/pages/myField.js)
        // Trang Luân canh đọc DS.gardens: vẽ lại mỗi lần mở để thấy thửa vừa thêm/sửa ở Ruộng của tôi.
        if (id === 'rotations') renderRotations()
        if (id === 'glossary') renderGlossary() // site/pages/glossaryPage.js
        wireMotion()
        if (changed && bootDone) runTabTransition(id)
      }

      function openPageOf(el) {
        const host = el?.closest('[data-page]')
        if (!host || host.dataset.page === S.page) return
        history.pushState(null, '', pageHref(host.dataset.page))
        showPage(host.dataset.page)
      }

      // Dùng cho các nút "đi tới": tên trang thì mở trang, id phần tử thì mở trang chứa nó rồi cuộn tới.
      function goTo(target) {
        // 1. Tên một trang (myfield, rotations, glossary, home): mở trang đó từ đầu.
        if (PAGES.some((p) => p.id === target)) {
          const href = pageHref(target)
          if (location.hash === href) return route() // cùng địa chỉ thì "hashchange" không chạy
          return (location.hash = href)
        }
        // 2. Id của một phần trong trang (vd. dashboard, whatif): mở trang chứa nó rồi cuộn tới.
        const el = document.getElementById(target)
        if (!el) return
        openPageOf(el)
        el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' })
      }

      function route() {
        const h = decodeURIComponent(location.hash.slice(1))
        if (h === '' || h.startsWith('/')) {
          const page = PAGES.find((p) => p.slug === h.slice(1) || p.aliases?.includes(h.slice(1))) ?? PAGES[0]
          showPage(page.id)
          return scrollTo({ top: 0, behavior: 'instant' })
        }
        const el = document.getElementById(h)
        const host = el?.closest('[data-page]')
        if (!host) return showPage(S.page)
        showPage(host.dataset.page)
        el.scrollIntoView({ block: 'start' })
      }

      function toggleHeroAnim() {
        const next = !(S.heroAnim !== false)
        S.heroAnim = next
        const scene = $('#mk-hero-scene')
        const btn = document.querySelector('[data-action="toggleHeroAnim"]')
        const H = REDESIGN_TEXT[S.lang]
        if (btn) {
          btn.setAttribute('aria-pressed', String(next))
          const labelSpan = btn.querySelector('span:last-child')
          if (labelSpan) labelSpan.textContent = next ? H.sceneAnimOn : H.sceneAnimOff
        }
        if (!scene) return
        if (!next) {
          scene.classList.remove('is-blinking')
          void scene.offsetWidth
          scene.classList.add('is-blinking')
          setTimeout(() => {
            if (S.heroAnim === false) scene.dataset.anim = 'off'
          }, 120)
          setTimeout(() => scene.classList.remove('is-blinking'), 320)
        } else {
          scene.dataset.anim = 'on'

      /* ================================================================
       * Rotation comparison: 4 cards, each with the 5 required parts

      const CONF_TONE = { high: 'good', medium: 'warn', low: 'bad' }

      function rotLines(lines) {
        // Màn rộng: giữ trích nguồn trên một dòng. Điện thoại: cho xuống dòng, vì một trích dẫn dài
        // (vd. "FAO Training Manual 3, Tables 4–5") không ngắt được sẽ đẩy thẻ rộng hơn màn hình 375 px.
        const srcTag = (src) =>
          src.length ? ` <span class="text-xs font-semibold text-moss-700 sm:whitespace-nowrap">(${src.map((k) => SOURCES[k]?.short ?? k).join(' · ')})</span>` : ''
        return `<ul class="mt-2 space-y-2 text-[15px] leading-relaxed">${lines
          .map((x) => `<li class="flex gap-2.5"><span class="mt-2.5 size-1.5 shrink-0 rounded-full bg-moss-700"></span><span>${esc(x.text)}${srcTag(x.src)}</span></li>`)
          .join('')}</ul>`
      }

      function rotationCard(rot, rank, baseline, R, tied = false) {
        const P = rotationParts(rot, baseline, S.lang)
        const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1)
        const bars = ['water', 'soil', 'income', 'risk']
          .map(
            (k) => `
            <div class="grid grid-cols-[8.5rem_1fr_4.5rem] items-center gap-3 text-sm">
              <span class="font-semibold text-muted">${R.criteria[k]}</span>
              <span class="h-2 rounded-full bg-moss-100"><span class="block h-full rounded-full bg-moss-700" style="width:${rot.scores[k]}%"></span></span>
              <span class="tabular text-right font-bold">${rot.scores[k]} <span class="font-semibold text-muted">+${rot.contributions[k].toLocaleString(R.locale)}</span></span>
            </div>`,
          )
          .join('')
        const fold = (title, lines) => `
          <details class="group border-t border-line py-3">
            <summary class="flex cursor-pointer list-none items-center justify-between gap-3 font-extrabold">${title}<span class="text-muted transition-transform duration-300 group-open:rotate-180">${icon('chevron-down', 'size-5')}</span></summary>
            ${rotLines(lines)}
          </details>`
        return `
          <article class="flex flex-col rounded-[28px] border border-line bg-white p-6 shadow-card sm:p-7">
            <div class="flex items-start justify-between gap-4">
              <div>
                <p class="text-sm font-bold text-muted">${tied ? R.rankTied(rank) : R.rank(rank)}${rot.baseline ? ` · ${R.baseline}` : ''}</p>
                <h3 class="mt-1 text-2xl font-extrabold tracking-tight">${rot.id}. ${rot.crops.map((c) => cap(R.crops[c])).join(' – ')}</h3>
              </div>
              <p class="shrink-0 text-right"><span class="tabular block text-5xl font-extrabold leading-none tracking-tight">${rot.total}</span><span class="mt-1 block text-xs font-bold text-muted">${R.total} / 100</span></p>
            </div>
            <div class="mt-3 flex flex-wrap gap-1.5">${rot.crops
              .map((c, i) => `<span class="rounded-full bg-moss-50 px-3 py-1 text-[13px] font-bold text-moss-900">${R.seasons[['dx', 'ht', 'td'][i]]}: ${R.crops[c]}</span>`)
              .join('')}</div>
            <!-- Thanh điểm đặt TRƯỚC khung độ tin cậy: phần phía trên thẻ nào cũng cao bằng nhau,
                 nên thanh điểm của hai thẻ cạnh nhau luôn thẳng hàng. -->
            <div class="mt-5 space-y-2.5">${bars}</div>
            <div class="mt-5 rounded-2xl bg-ground p-4">
              <p class="flex flex-wrap items-center gap-2 text-sm font-bold">${R.confidence}: ${badge(CONF_TONE[rot.confidence.level], R.levels[rot.confidence.level])}</p>
              ${rotLines(P.confidence)}
            </div>
            <div class="mt-6">
              <h4 class="font-extrabold">${R.parts.why}</h4>${rotLines(P.why)}
              <h4 class="mt-5 font-extrabold">${R.parts.benefits}</h4>${rotLines(P.benefits)}
            </div>
            <div class="mt-5">
              ${fold(R.parts.evidence, P.evidence)}
              ${fold(R.parts.risks, P.risks)}
              ${fold(R.parts.gaps, P.gaps)}
            </div>
            <p class="mt-auto border-t border-line pt-4 text-xs leading-relaxed text-muted">${R.sourcesLabel}: ${P.sources
              .map((k) => `<a href="${SOURCES[k].url}" target="_blank" rel="noopener" title="${esc(SOURCES[k].cite)}" class="font-semibold text-moss-700 underline underline-offset-2 hover:text-ink">${SOURCES[k].short}</a>`)
              .join(' · ')}</p>
          </article>`
      }

      // Một thanh trượt sáng màu (dùng chung class .range của trang).
      function rotSlider(attr, key, label, value, min, max, unit, step = 10) {

      function renderRotationResults() {
        if (!$('#rot-results')) return rfRender() // bảng huyện đã gỡ; khối thửa vẫn cần vẽ lại theo ưu tiên mới
        const R = ROT_TEXT[S.lang]
        const district = PROVINCES.find((p) => p.id === S.rotDistrict)
        const inputs = districtInputs(PRECOMPUTED, district.id)
        const result = rankRotations({ ...inputs, priorities: S.rotPriorities, whatIf: rxWhatIf() }) // rxWhatIf: site/pages/rotationExtras.js
        const box = $('#rot-results')
        if (!result.rankable) {
          box.innerHTML = `<p class="rounded-[28px] border border-dashed border-sun-400 bg-sun-100 p-6 text-[15px] font-semibold leading-relaxed text-sun-700">${esc(R.notRankable(district.name, result.reason.peaks))}</p>`
          return rfRender() // khối theo từng thửa vẫn vẽ (site/pages/rotationFarm.js)
        }
        const baseline = result.rotations.find((r) => r.baseline)
        const calendar = result.windows
          .map((w) => `<span class="font-bold text-ink">${R.seasons[w.season]}</span> ${R.months[w.months[0] - 1]}–${R.months[w.months[w.months.length - 1] - 1]}`)
          .join(' · ')
        box.innerHTML = `
          <div class="flex flex-wrap items-center gap-x-4 gap-y-2 rounded-[28px] border border-line bg-white px-6 py-4 text-[15px] text-muted shadow-card">

            ${badge(CONF_TONE[result.calendarConfidence], R.levels[result.calendarConfidence])}

          <p class="mt-4 text-sm text-muted">${R.scoreNote}${S.rotWhatIf.dryRainPct !== 0 || S.rotWhatIf.deltaT !== 0 ? ` ${whatIfTag()} ${S.rotWhatIf.dryRainPct !== 0 ? R.whatIfActive(S.rotWhatIf.dryRainPct) : ''}${rxActiveNote()}` : ''}</p>
          ${rxStrategiesHtml(result)}
          <div class="mt-6 grid gap-5 lg:grid-cols-2">${result.rotations
            .map((rot) => {
              // Hạng = 1 + số kiểu có điểm CAO HƠN. Bằng điểm thì đồng hạng.
              const rank = 1 + result.rotations.filter((r) => r.total > rot.total).length

      // Dải 12 tháng: một bảng thật (<table>) để đọc được bằng trình đọc màn hình và cuộn ngang trên điện thoại.
      const SEASON_TONE = { dx: 'bg-moss-900 text-white', ht: 'bg-moss-100 text-moss-900', td: 'bg-lime-100 text-moss-900' }
      const ndviColor = (v) => (v > 0.65 ? '#3fae4a' : v >= 0.55 ? '#9fd55a' : '#dccb8c') // thang NDVI của DESIGN.md

      function renderSeasonStrip() {
        if (!$('#rot-strip')) return // khung đã gỡ khỏi trang Luân canh (prompt 03)
        const R = ROT_TEXT[S.lang]
        const inputs = districtInputs(PRECOMPUTED, S.rotDistrict)
        const monthly = PRECOMPUTED.rule.districts.find((d) => d.id === S.rotDistrict).monthly
        const strip = seasonStrip({ climate: inputs.climate, monthly, windows: seasonWindows(inputs.peakDays) })
        const num = (v, d = 0) => Number(v).toLocaleString(R.locale, { minimumFractionDigits: d, maximumFractionDigits: d })
        const maxRain = Math.max(...strip.map((s) => s.rainMm))
        const col = (s) => (s.isVulnerable ? 'bg-sun-100' : '')
        const th = (label) => `<th scope="row" class="sticky left-0 z-10 bg-white py-2.5 pl-5 pr-3 text-left text-[13px] font-bold text-muted">${label}</th>`

          </div>
          <div class="mt-4 overflow-x-auto rounded-[28px] border border-line bg-white shadow-card">

      function shareSnapshot() {
        const vi = S.lang === 'vi'
        const MT = MAP_TEXT[S.lang]
        const RT = ROT_TEXT[S.lang]
        if (MF.loc) {
          const poly = typeof mfdPolygon === 'function' ? mfdPolygon() : null
          const areaHa = poly && typeof geoAreaM2 === 'function' ? (geoAreaM2(poly) / 10000).toFixed(2) : null
          const place = MF.loc.name || `${MF.loc.lat.toFixed(4)}, ${MF.loc.lon.toFixed(4)}`
          const elig = (MW.evalResult?.strategies ?? []).filter((s) => s.eligibility === 'eligible').sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99))
          const top = elig[0]
          const summary = top
            ? vi
              ? `Chiến lược dẫn đầu: ${top.strategyId} (${top.crops.map((c) => RT.crops[c]).join(' – ')}) · ${top.score}/100 · Rủi ro: ${MT.strat.risk[top.riskLevel]}.`
              : `Top strategy: ${top.strategyId} (${top.crops.map((c) => RT.crops[c]).join(' – ')}) · ${top.score}/100 · Risk: ${MT.strat.risk[top.riskLevel]}.`
            : vi
              ? 'Chưa đủ điều kiện xếp hạng chiến lược tại điểm này; xem chi tiết các tiêu chí và mục thiếu thông tin trên bản đồ.'
              : 'Not yet rankable at this point; review criteria and missing local inputs in My field.'
          const steps = [
            areaHa ? (vi ? `Diện tích khoanh thửa: ${areaHa} ha` : `Drawn boundary: ${areaHa} ha`) : null,
            MW.evalResult?.evaluationId ? MT.plan.evalTag(MW.evalResult.evaluationId) : null,
            vi ? 'Trao đổi với cán bộ khuyến nông địa phương trước khi xuống giống.' : 'Review with a local extension officer before sowing.',
          ].filter(Boolean)
          return { headline: `${place}`, summary, steps, footer: 'NASA POWER · MODIS · Open-Meteo Elevation' }
        }
        // rankRotations nhận MỘT đối tượng và trả về .rotations (đã sắp xếp); whatIf giống hệt trang Luân canh.
        const rotRes = rankRotations({ ...districtInputs(PRECOMPUTED, S.rotDistrict), priorities: S.rotPriorities, whatIf: rxWhatIf() })

        const best = rotRes.rotations?.[0]
        return {

          summary: best
            ? vi
              ? `Luân canh đứng đầu theo ưu tiên hiện tại: ${best.id} (${best.crops.map((c) => RT.crops[c]).join(' – ')}) · ${best.total}/100.`

              : 'No clear 3-crop NDVI calendar for this district yet.',

          footer: 'MODIS MOD13Q1 · NASA POWER · Linh et al. · FAO',
        }
      }

      async function ask(q) {
        q = q.trim()
        if (!q || S.busy) return
        S.busy = true
        const history = [...S.chat, { role: 'user', text: q }]
        S.chat = [...history, { role: 'model', text: '', source: 'ai', pending: true }]
        renderOverlay()
        const last = () => S.chat[S.chat.length - 1]
        const data = typeof mfCompute === 'function' ? mfCompute() : null
        const poly = typeof mfdPolygon === 'function' ? mfdPolygon() : null
        const areaM2 = poly && typeof geoAreaM2 === 'function' ? geoAreaM2(poly) : 0
        const rotResult = rankRotations({ ...districtInputs(PRECOMPUTED, S.rotDistrict), priorities: S.rotPriorities, whatIf: rxWhatIf() })
        const ctx = assistantContext({
          loc: typeof MF !== 'undefined' ? MF.loc : null,
          data,
          evalResult: typeof MW !== 'undefined' ? MW.evalResult : null,
          rotDistrict: S.rotDistrict,
          rotResult,
          areaM2,
          polygon: poly,
        })
        const allowed = asstLedgerNumbers(ctx, typeof MF_LEDGER !== 'undefined' ? MF_LEDGER : null)
        let answer = null
        if (served) {
          try {
            const res = await fetch('/api/assistant', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                lang: S.lang,
                context: ctx,
                messages: history.slice(-10).map((m) => ({ role: m.role, text: m.text })),
              }),
            })
            if (res.ok && res.body) {
              const reader = res.body.getReader()
              const dec = new TextDecoder()
              let text = ''
              for (;;) {
                const { done, value } = await reader.read()
                if (done) break
                text += dec.decode(value, { stream: true })
                last().text = text
                renderOverlay()
              }
              const trimmed = text.trim()
              const check = trimmed ? asstVerifyReply(trimmed, allowed) : { ok: false }
              answer = check.ok ? trimmed : null
            }
          } catch {
            answer = null
          }
        }
        Object.assign(last(), answer ? { text: answer, pending: false } : { text: fallbackAnswer(q, ctx, S.lang), source: 'sample', pending: false })
        S.busy = false
        renderOverlay()
      }

      document.addEventListener('click', (e) => {
        // Sổ bằng chứng: chạm vào một con số in bởi showValue() (site/pages/myField.js)
        const evBtn = e.target.closest('[data-ev]')
        if (evBtn) {
          e.preventDefault()
          return mfOpenLedger(evBtn)
        }
        const termBtn = e.target.closest('[data-term]')
        if (termBtn) {
          e.preventDefault()
          return openTerm(termBtn)
        }
        if (openTermEl && !e.target.closest('#term-pop')) closeTerm()
        if (e.target.matches('[data-scrim]')) {
          S.dialog = null
          return renderOverlay()
        }
        const a = e.target.closest('[data-action]')
        if (!a) return
        const v = a.dataset.value
        switch (a.dataset.action) {
          case 'lang':
            S.lang = v
            persist()
            return renderAll()
          case 'rot-reset-weights':
            S.rotPriorities = { ...DEFAULT_PRIORITIES }
            persist()
            renderRotationControls()
            return renderRotationResults()
          case 'rot-reset-whatif':
            S.rotWhatIf = { ...DEFAULT_WHAT_IF, deltaT: 0 }
            renderRotationControls()
            return renderRotationResults()
          case 'goto':
            return goTo(v)
          case 'menu':
            S.menuOpen = !S.menuOpen
            return renderNav()
          case 'share':
            S.dialog = 'share'
            return renderOverlay()
          case 'assistant':
            S.dialog = 'assistant'
            return renderOverlay()
          case 'close-dialog':
            S.dialog = null
            return renderOverlay()
          case 'close-term':
            return closeTerm()
          case 'print':
            return window.print()
          case 'copy':
            return navigator.clipboard?.writeText(shareText()).then(() => {
              const l_ = $('#copy-label')
              if (l_) l_.textContent = t().copied
            })
          case 'native-share':
            return navigator.share({ title: appName(), text: shareText() }).catch(() => {})
          case 'ask':
            return ask(v)
        }
      })

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return
        if (openTermEl) return closeTerm()
        if (S.dialog) {
          S.dialog = null
          return renderOverlay()
        }
      })

      document.addEventListener('change', (e) => {
        // Thả thanh giả định: vẽ lại khung để hiện/ẩn viền nét đứt và nhãn "giả định".
        if (e.target.dataset?.rotWhatif) return renderRotationControls()
        const sel = e.target.closest('[data-select]')
        if (!sel) return
        if (sel.dataset.select === 'rotDistrict') {
          S.rotDistrict = sel.value
          persist()
          return renderRotations()
        }
      })

      // Kéo thanh trượt luân canh: chỉ vẽ lại phần kết quả, để thanh đang kéo không bị thay mới.
      function updateRotSlider(input) {
        const value = Number(input.value)
        const min = Number(input.min)
        const max = Number(input.max)
        input.style.setProperty('--fill', `${((value - min) / (max - min)) * 100}%`)
        const key = input.dataset.rotWeight ?? input.dataset.rotWhatif
        $(`#rot-out-${key}`).textContent = `${value}${input.dataset.unit}`
        return value
      }

      document.addEventListener('input', (e) => {
        if (e.target.dataset?.rotWeight) {
          S.rotPriorities = { ...S.rotPriorities, [e.target.dataset.rotWeight]: updateRotSlider(e.target) }
          persist()
          return renderRotationResults()
        }
        if (e.target.dataset?.rotWhatif) {
          S.rotWhatIf = { ...S.rotWhatIf, [e.target.dataset.rotWhatif]: updateRotSlider(e.target) }
          return renderRotationResults()
        }
      })

      document.addEventListener('submit', (e) => {
        if (e.target.id !== 'chat-form') return
        e.preventDefault()
        const input = $('#chat-input')
        const q = input.value
        input.value = ''
        ask(q)
      })
      document.addEventListener('keydown', (e) => {
        if (e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          $('#chat-form').requestSubmit()
        }
      })

      /* ================================================================
       * Motion: reveal on scroll, count-ups, the statement, the nav
       * ================================================================ */
      const revealedKeys = new Set()
      function revealElement(el) {
        if (!el) return
        if (el.dataset.reveal) revealedKeys.add(el.dataset.reveal)
        el.classList.add('is-in')
        el.querySelectorAll('[data-count]').forEach(countUp)
      }
      function handleIntersect(entries, observer) {
        for (const en of entries) {
          if (!en.isIntersecting) continue
          const el = en.target
          observer.unobserve(el)
          if (reduced() || (el.dataset.reveal && revealedKeys.has(el.dataset.reveal))) {
            revealElement(el)
          } else if (!el.dataset.revealing) {
            el.dataset.revealing = '1'
            setTimeout(() => revealElement(el), 180)
          }
        }
      }
      const io = new IntersectionObserver(handleIntersect, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' })
      let panelIo = null
      let panelIoRoot = null
      function getPanelObserver() {
        const panel = document.getElementById('mw-panel-body')
        if (!panel) return io
        if (panelIoRoot !== panel) {
          panelIo?.disconnect()
          panelIoRoot = panel
          panelIo = new IntersectionObserver(handleIntersect, { root: panel, threshold: 0.06, rootMargin: '0px 0px -16px 0px' })
        }
        return panelIo
      }
      function wireMotion() {
        const panel = document.getElementById('mw-panel-body')
        const pIo = panel ? getPanelObserver() : null
        document.querySelectorAll('[data-reveal]:not(.is-in)').forEach((el) => {
          const pageEl = el.closest('[data-page]')
          if (pageEl && pageEl.hidden) return
          const key = el.dataset.reveal
          if (reduced() || (key && revealedKeys.has(key))) {
            revealElement(el)
          } else if (panel && panel.contains(el)) {
            pIo.observe(el)
          } else {
            io.observe(el)
          }
        })
        onScroll()
      }
      function countUp(el) {
        if (el.dataset.done) return
        el.dataset.done = '1'
        statsCounted = true
        const target = Number(el.dataset.count)
        if (!Number.isFinite(target)) return
        if (reduced()) return (el.textContent = String(target))
        const t0 = performance.now()
        const step = (now) => {
          const k = Math.min(1, (now - t0) / 1400)
          el.textContent = String(Math.round(target * (1 - Math.pow(1 - k, 4))))
          if (k < 1) requestAnimationFrame(step)
          else el.textContent = String(target)
        }
        requestAnimationFrame(step)
      }
      let ticking = false
      function onScroll() {
        if (ticking) return
        ticking = true
        requestAnimationFrame(() => {
          ticking = false
          // Thanh menu trong suốt chỉ khi đang ở đầu Trang chủ (nằm trên ảnh); các trang khác luôn nền trắng.
          $('#nav').dataset.solid = String(scrollY > 40 || S.page !== 'home')
        })
      }
      addEventListener('scroll', onScroll, { passive: true })
      let resizeTimer
      addEventListener('resize', () => {
        clearTimeout(resizeTimer)
        resizeTimer = setTimeout(closeTerm, 150)
      })

      document.addEventListener('click', (e) => {
        const animToggle = e.target.closest('[data-action="toggleHeroAnim"]')
        if (animToggle) toggleHeroAnim()
      })

      let burstCount = 0
      document.addEventListener('pointerdown', (e) => {
        if (reduced() || e.button > 0) return
        const target = e.target.closest('a, button, summary, [role="button"], input, select, label, [data-rf], [data-mg], [data-mw], [data-csm], [data-gp], [data-term], [data-ev], .mk-tool-card, .rf-card, .gp-card')
        if (!target || target.disabled) return
        const rect = target.getBoundingClientRect()
        const x = e.clientX || rect.left + rect.width / 2
        const y = e.clientY || rect.top + rect.height / 2
        if (!Number.isFinite(x) || !Number.isFinite(y) || document.querySelectorAll('.mk-click-burst').length > 6) return
        const ns = 'http://www.w3.org/2000/svg'
        const svg = document.createElementNS(ns, 'svg')
        svg.setAttribute('viewBox', '0 0 64 64')
        svg.setAttribute('aria-hidden', 'true')
        svg.setAttribute('class', 'mk-click-burst')
        svg.style.left = `${x}px`
        svg.style.top = `${y}px`
        svg.style.transform = `rotate(${(burstCount++ * 47) % 360}deg)`
        svg.innerHTML = `<path class="mk-burst-swirl" d="M22 22 C18 16, 12 17, 9 9" stroke="#4eb862" stroke-width="1.9"/><path class="mk-burst-swirl" d="M41 21 C46 15, 51 17, 55 10" stroke="#74d44c" stroke-width="1.75" style="animation-delay:35ms"/><path class="mk-burst-swirl" d="M42 40 C48 44, 46 51, 53 55" stroke="#9be564" stroke-width="1.65" style="animation-delay:60ms"/><path class="mk-burst-swirl" d="M22 41 C16 45, 17 51, 9 54" stroke="#f5b82e" stroke-width="1.55" style="animation-delay:45ms"/><path class="mk-burst-swirl" d="M33 19 C32 12, 36 8, 34 4" stroke="#ffe066" stroke-width="1.5" style="animation-delay:25ms"/><circle class="mk-burst-spark" cx="18" cy="8" r="1.9" fill="#ffe066"/><circle class="mk-burst-spark" cx="53" cy="27" r="1.7" fill="#74d44c" style="animation-delay:55ms"/><circle class="mk-burst-spark" cx="26" cy="56" r="1.6" fill="#f5b82e" style="animation-delay:75ms"/>`
        document.body.appendChild(svg)
        setTimeout(() => svg.remove(), 650)
      }, { passive: true })

      function initLoader(customMinMs) {
        const loader = $('#mk-loader')
        if (!loader) {
          bootDone = true
          return
        }
        const queryMs = Number(new URLSearchParams(location.search).get('loadms')) || 0
        const minWait = Math.max(670, Math.min(30000, customMinMs ?? queryMs))
        const t0 = performance.now()
        let domRendered = true
        let winLoaded = document.readyState === 'complete'
        let finishing = false
        let currentP = 0

        if (!winLoaded) addEventListener('load', () => { winLoaded = true }, { once: true })
        loader.dataset.done = 'false'
        delete loader.dataset.watering
        delete loader.dataset.fast

        const clamp01 = (v) => Math.max(0, Math.min(1, v))
        const setP = (p) => {
          currentP = clamp01(p)
          const soilP = clamp01(currentP / 0.25)
          const stemP = clamp01((currentP - 0.14) / 0.42)
          const leafLP = clamp01((currentP - 0.46) / 0.36)
          const leafRP = clamp01((currentP - 0.56) / 0.44)
          loader.style.setProperty('--load-p', currentP.toFixed(3))
          loader.style.setProperty('--soil-p', soilP.toFixed(3))
          loader.style.setProperty('--stem-p', stemP.toFixed(3))
          loader.style.setProperty('--leaf-l-p', leafLP.toFixed(3))
          loader.style.setProperty('--leaf-r-p', leafRP.toFixed(3))
        }

        if (reduced()) {
          setP(1)
          setTimeout(() => {
            loader.dataset.done = 'true'
            bootDone = true
            triggerPageFadeIn(S.page)
          }, 120)
          return
        }

        const tick = (now) => {
          const elapsed = now - t0
          const timeCap = clamp01(elapsed / minWait)
          const realCap = winLoaded && customMinMs == null ? 1 : (customMinMs != null && elapsed >= minWait ? 1 : (winLoaded ? 0.92 : (domRendered ? 0.68 : 0.35)))
          const ready = (customMinMs != null ? elapsed >= minWait : winLoaded && elapsed >= minWait)

          if (!ready && elapsed >= 3000) loader.dataset.watering = 'true'

          if (!finishing) {
            const softTarget = ready ? 1 : Math.min(0.88, Math.max(timeCap * 0.88, realCap * 0.72))
            const nextP = ready ? currentP + (1 - currentP) * 0.42 + 0.04 : currentP + (softTarget - currentP) * 0.18 + 0.01
            setP(Math.min(ready ? 1 : 0.9, nextP))
            if (ready && currentP >= 0.985) {
              finishing = true
              setP(1)
              delete loader.dataset.watering
              setTimeout(() => {
                loader.dataset.done = 'true'
                bootDone = true
                const mainEl = $('#main')
                if (mainEl) {
                  mainEl.classList.remove('mk-page-fade-in')
                  void mainEl.offsetWidth
                  mainEl.classList.add('mk-page-fade-in')
                }
              }, 80)
              return
            }
            requestAnimationFrame(tick)
          }
        }
        requestAnimationFrame(tick)
      }
      window.mkSimulateLoad = (ms = 4500) => initLoader(ms)

      /* ================================================================
       * Start
       * ================================================================ */
      initLoader()
      renderAll()
      route() // mở đúng trang theo địa chỉ, vd. tải lại ở #/luan-canh thì vẫn ở trang Luân canh
    </script>
  </body>
</html>
