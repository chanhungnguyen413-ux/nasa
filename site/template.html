          } catch {
            return d

        // Phase 2: mục "Nguồn dữ liệu" thành trang "Dữ liệu"; địa chỉ cũ vẫn mở được (aliases).
        { id: 'sources', slug: 'du-lieu', aliases: ['nguon-du-lieu'], nav: 'navSources', icon: 'database' },
      ]
      const menuPages = () => PAGES.filter((p) => p.menu !== false)
      const pageHref = (id) => `#/${PAGES.find((p) => p.id === id).slug}`

      // Hiện đúng một trang, cập nhật menu, tiêu đề tab và nền thanh menu.
      function showPage(id) {
        const changed = S.page !== id
        S.page = id
        S.menuOpen = false
        document.querySelectorAll('[data-page]').forEach((el) => (el.hidden = el.dataset.page !== id))
        const page = PAGES.find((p) => p.id === id)
        document.title = id === 'home' ? `${appName()} · ${l().heroTitle}` : `${l()[page.nav]} · ${appName()}`
        renderNav()
        renderFooter() // đánh dấu trang đang mở ở menu chân trang
        $('#footer').hidden = id === 'myfield'
        $('#mobilebar').hidden = id === 'myfield'
        $('#fab').classList.toggle('bottom-12', id === 'myfield')
        $('#fab').classList.toggle('bottom-6', id !== 'myfield')
        $('#nav').dataset.solid = String(id !== 'home' || scrollY > 40)
        if (changed) closeTerm()
        if (id === 'myfield') myFieldOnShow() // bản đồ Leaflet chỉ khởi tạo được khi khung đang hiện (site/pages/myField.js)
        if (id === 'sources') dataHubOnShow() // trang Dữ liệu: chọn lại ruộng đã lưu (site/pages/dataHub.js)
      }

      // Mở trang chứa phần tử id (nếu cần), ghi địa chỉ mới vào lịch sử để nút Back hoạt động.
      function openPageOf(el) {
        const host = el?.closest('[data-page]')
        if (!host || host.dataset.page === S.page) return
        history.pushState(null, '', pageHref(host.dataset.page))
        showPage(host.dataset.page)
      }

      // Dùng cho các nút "đi tới": tên trang thì mở trang, id phần tử thì mở trang chứa nó rồi cuộn tới.
      function goTo(target) {
        // 1. Tên một trang (rotations, field, weather, sources, home): mở trang đó từ đầu.
        if (PAGES.some((p) => p.id === target)) {
          const href = pageHref(target)
          if (location.hash === href) return route() // cùng địa chỉ thì "hashchange" không chạy
          return (location.hash = href)
        }
        // 2. Id của một phần trong trang (vd. dashboard, whatif): mở trang chứa nó rồi cuộn tới.
        const el = document.getElementById(target)
        if (!el) return
        openPageOf(el)
        el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' })
      }

      function route() {
        const h = decodeURIComponent(location.hash.slice(1))
        if (h === '' || h.startsWith('/')) {
          const page = PAGES.find((p) => p.slug === h.slice(1) || p.aliases?.includes(h.slice(1))) ?? PAGES[0]
          showPage(page.id)
          return scrollTo({ top: 0, behavior: 'instant' })
        }
        const el = document.getElementById(h)
        const host = el?.closest('[data-page]')
        if (!host) return showPage(S.page)
        showPage(host.dataset.page)
        el.scrollIntoView({ block: 'start' })
      }
      addEventListener('hashchange', route)

      /* ================================================================
       * Nav
       * ================================================================ */
      function renderNav() {
        const L_ = l()
        const link = (p) =>
          `<a href="${pageHref(p.id)}" ${S.page === p.id ? 'aria-current="page"' : ''} class="rounded-full px-3 py-2 text-sm font-semibold text-white/85 transition-colors hover:text-white aria-[current=page]:bg-white/15 aria-[current=page]:text-white group-data-[solid=true]:text-muted group-data-[solid=true]:hover:text-ink group-data-[solid=true]:aria-[current=page]:bg-moss-50 group-data-[solid=true]:aria-[current=page]:text-moss-900">${L_[p.nav]}</a>`
        const mobileLink = (p) =>
          `<a href="${pageHref(p.id)}" ${S.page === p.id ? 'aria-current="page"' : ''} class="flex items-center gap-3 rounded-2xl px-4 py-3 text-[15px] font-bold text-ink hover:bg-moss-50 aria-[current=page]:bg-moss-50 aria-[current=page]:text-moss-900"><span class="grid size-9 place-items-center rounded-full bg-lime-400 text-moss-950">${icon(p.icon, 'size-4')}</span>${L_[p.nav]}</a>`
        $('#nav').innerHTML = `

              <span class="grid size-9 place-items-center rounded-full bg-lime-400 text-moss-950">${icon('sprout', 'size-5')}</span>
              <span class="text-[15px] font-extrabold tracking-tight">${appName()}</span>
            </a>
            <div class="hidden items-center gap-1 lg:flex">
              ${menuPages().map(link).join('')}
            </div>
            <div class="flex items-center gap-2">
              <div role="group" aria-label="${t().langLabel}" class="flex rounded-full border border-white/40 p-0.5 group-data-[solid=true]:border-line">
                ${['vi', 'en']
                  .map(
                    (v) =>
                      `<button type="button" data-action="lang" data-value="${v}" aria-pressed="${S.lang === v}" class="rounded-full px-3 py-1.5 text-[13px] font-bold text-white/85 transition-colors group-data-[solid=true]:text-muted aria-pressed:bg-lime-400 aria-pressed:text-moss-950 group-data-[solid=true]:aria-pressed:text-moss-950">${v.toUpperCase()}</button>`,
                  )
                  .join('')}
              </div>
              <a href="${pageHref('rotations')}" class="hidden rounded-full bg-white px-4 py-2 text-sm font-bold text-moss-950 transition-all duration-300 hover:-translate-y-0.5 hover:bg-lime-400 sm:inline-flex group-data-[solid=true]:bg-moss-900 group-data-[solid=true]:text-white group-data-[solid=true]:hover:bg-moss-800">${L_.contact}</a>
              <button type="button" data-action="menu" aria-expanded="${S.menuOpen}" aria-controls="mobile-menu" aria-label="${L_.menu}" class="grid size-10 place-items-center rounded-full border border-white/40 text-white lg:hidden group-data-[solid=true]:border-line group-data-[solid=true]:text-ink">${icon(S.menuOpen ? 'x' : 'menu', 'size-5')}</button>
            </div>
          </nav>
          ${
            S.menuOpen
              ? `<div id="mobile-menu" class="mx-5 mb-3 rounded-[28px] border border-line bg-white p-2 shadow-lift sm:mx-8 lg:hidden">${menuPages().map(mobileLink).join('')}</div>`
              : ''
          }`
      }

      // Only the chip changes with the numbers, so the hero photo never reloads.
      // Phase 1: không hiện gợi ý tưới của 4 thửa MÔ PHỎNG ở trang chủ nữa (blueprint: ẩn dữ liệu demo, xoá ở Phase 4).

      function renderStats() {

      /* ================================================================
       * Home: "Where to start?" — one card per page
       * ================================================================ */
      function renderPagesOverview() {
        const L_ = l()
        $('#pages').innerHTML = `
          <div class="max-w-2xl" data-reveal>
            <h2 class="text-4xl font-extrabold tracking-tight sm:text-5xl">${L_.pagesTitle}</h2>

            .map(
              (p, i) => `
            <a href="${pageHref(p.id)}" class="group flex flex-col rounded-[28px] border border-line bg-white p-6 shadow-card transition-all duration-300 hover:-translate-y-1 hover:border-moss-700 hover:shadow-lift" data-reveal style="transition-delay:${i * 80}ms">
              <span class="grid size-12 place-items-center rounded-full bg-lime-400 text-moss-950">${icon(p.icon, 'size-5')}</span>
              <span class="mt-5 text-xl font-extrabold tracking-tight">${L_[p.nav]}</span>

              <span class="mt-auto inline-flex items-center gap-1.5 pt-5 text-sm font-bold text-moss-700 group-hover:text-ink">${L_.openPage}${icon('arrow-right', 'size-4 transition-transform duration-300 group-hover:translate-x-1')}</span>
            </a>`,
            )
            .join('')}</div>`

      /* ================================================================
       * Rotation comparison: 4 cards, each with the 5 required parts
       * (scores from site/logic/rotation.js, words from site/i18n/rotationText.js)
       * ================================================================ */
      const CONF_TONE = { high: 'good', medium: 'warn', low: 'bad' }

      function rotLines(lines) {
        // Màn rộng: giữ trích nguồn trên một dòng. Điện thoại: cho xuống dòng, vì một trích dẫn dài
        // (vd. "FAO Training Manual 3, Tables 4–5") không ngắt được sẽ đẩy thẻ rộng hơn màn hình 375 px.
        const srcTag = (src) =>
          src.length ? ` <span class="text-xs font-semibold text-moss-700 sm:whitespace-nowrap">(${src.map((k) => SOURCES[k]?.short ?? k).join(' · ')})</span>` : ''
        return `<ul class="mt-2 space-y-2 text-[15px] leading-relaxed">${lines
          .map((x) => `<li class="flex gap-2.5"><span class="mt-2.5 size-1.5 shrink-0 rounded-full bg-moss-700"></span><span>${esc(x.text)}${srcTag(x.src)}</span></li>`)
          .join('')}</ul>`
      }

      function rotationCard(rot, rank, baseline, R, tied = false) {
        const P = rotationParts(rot, baseline, S.lang)
        const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1)
        const bars = ['water', 'soil', 'income', 'risk']
          .map(
            (k) => `
            <div class="grid grid-cols-[8.5rem_1fr_4.5rem] items-center gap-3 text-sm">
              <span class="font-semibold text-muted">${R.criteria[k]}</span>
              <span class="h-2 rounded-full bg-moss-100"><span class="block h-full rounded-full bg-moss-700" style="width:${rot.scores[k]}%"></span></span>
              <span class="tabular text-right font-bold">${rot.scores[k]} <span class="font-semibold text-muted">+${rot.contributions[k].toLocaleString(R.locale)}</span></span>
            </div>`,
          )
          .join('')
        const fold = (title, lines) => `
          <details class="group border-t border-line py-3">
            <summary class="flex cursor-pointer list-none items-center justify-between gap-3 font-extrabold">${title}<span class="text-muted transition-transform duration-300 group-open:rotate-180">${icon('chevron-down', 'size-5')}</span></summary>
            ${rotLines(lines)}
          </details>`
        return `
          <article class="flex flex-col rounded-[28px] border border-line bg-white p-6 shadow-card sm:p-7">
            <div class="flex items-start justify-between gap-4">
              <div>
                <p class="text-sm font-bold text-muted">${tied ? R.rankTied(rank) : R.rank(rank)}${rot.baseline ? ` · ${R.baseline}` : ''}</p>
                <h3 class="mt-1 text-2xl font-extrabold tracking-tight">${rot.id}. ${rot.crops.map((c) => cap(R.crops[c])).join(' – ')}</h3>
              </div>
              <p class="shrink-0 text-right"><span class="tabular block text-5xl font-extrabold leading-none tracking-tight">${rot.total}</span><span class="mt-1 block text-xs font-bold text-muted">${R.total} / 100</span></p>
            </div>
            <div class="mt-3 flex flex-wrap gap-1.5">${rot.crops
              .map((c, i) => `<span class="rounded-full bg-moss-50 px-3 py-1 text-[13px] font-bold text-moss-900">${R.seasons[['dx', 'ht', 'td'][i]]}: ${R.crops[c]}</span>`)
              .join('')}</div>
            <!-- Thanh điểm đặt TRƯỚC khung độ tin cậy: phần phía trên thẻ nào cũng cao bằng nhau,
                 nên thanh điểm của hai thẻ cạnh nhau luôn thẳng hàng. -->
            <div class="mt-5 space-y-2.5">${bars}</div>
            <div class="mt-5 rounded-2xl bg-ground p-4">
              <p class="flex flex-wrap items-center gap-2 text-sm font-bold">${R.confidence}: ${badge(CONF_TONE[rot.confidence.level], R.levels[rot.confidence.level])}</p>
              ${rotLines(P.confidence)}
            </div>
            <div class="mt-6">
              <h4 class="font-extrabold">${R.parts.why}</h4>${rotLines(P.why)}
              <h4 class="mt-5 font-extrabold">${R.parts.benefits}</h4>${rotLines(P.benefits)}
            </div>
            <div class="mt-5">
              ${fold(R.parts.evidence, P.evidence)}
              ${fold(R.parts.risks, P.risks)}
              ${fold(R.parts.gaps, P.gaps)}
            </div>
            <p class="mt-auto border-t border-line pt-4 text-xs leading-relaxed text-muted">${R.sourcesLabel}: ${P.sources
              .map((k) => `<a href="${SOURCES[k].url}" target="_blank" rel="noopener" title="${esc(SOURCES[k].cite)}" class="font-semibold text-moss-700 underline underline-offset-2 hover:text-ink">${SOURCES[k].short}</a>`)
              .join(' · ')}</p>
          </article>`
      }

      // Một thanh trượt sáng màu (dùng chung class .range của trang).
      function rotSlider(attr, key, label, value, min, max, unit, step = 10) {
        return `
          <div>
            <div class="flex items-baseline justify-between gap-3"><label for="rot-${key}" class="text-sm font-semibold text-ink">${label}</label><output id="rot-out-${key}" class="tabular text-base font-extrabold text-moss-900">${value}${unit}</output></div>
            <input id="rot-${key}" ${attr}="${key}" data-unit="${unit}" type="range" min="${min}" max="${max}" step="${step}" value="${value}" class="range mt-1 w-full" style="--fill:${((value - min) / (max - min)) * 100}%" />
          </div>`
      }

      function renderRotationControls() {
        const R = ROT_TEXT[S.lang]
        const climate = PRECOMPUTED.climate.districts.find((d) => d.id === S.rotDistrict).months
        const dry = dryMonths(climate).map((m) => R.months[m - 1]).join(', ')
        const pct = S.rotWhatIf.dryRainPct
        const active = pct !== 0 || S.rotWhatIf.deltaT !== 0
        $('#rot-controls').innerHTML = `
          <div class="rounded-[28px] border border-line bg-white p-6 shadow-card sm:p-7">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <h3 class="text-lg font-extrabold">${R.prioritiesTitle}</h3>
              <button type="button" data-action="rot-reset-weights" class="rounded-full px-3 py-1.5 text-sm font-bold text-muted underline underline-offset-2 hover:text-ink">${R.resetWeights}</button>
            </div>
            <p class="mt-1 text-sm text-muted">${R.prioritiesHint}</p>
            <div class="mt-4 grid gap-x-6 gap-y-3 sm:grid-cols-2">${['water', 'soil', 'income', 'risk']
              .map((k) => rotSlider('data-rot-weight', k, R.criteria[k], S.rotPriorities[k], 0, 100, ''))
              .join('')}</div>
          </div>
          <div class="rounded-[28px] border bg-white p-6 shadow-card sm:p-7 ${active ? 'border-dashed border-sun-400' : 'border-line'}">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <h3 class="flex items-center gap-2 text-lg font-extrabold">${R.whatIfTitle} ${active ? whatIfTag() : ''}</h3>
              ${active ? `<button type="button" data-action="rot-reset-whatif" class="rounded-full px-3 py-1.5 text-sm font-bold text-muted underline underline-offset-2 hover:text-ink">${R.resetWhatIf}</button>` : ''}
            </div>
            <div class="mt-4 grid gap-3">${rotSlider('data-rot-whatif', 'dryRainPct', R.dryRainLabel, pct, -50, 50, '%')}${rotSlider('data-rot-whatif', 'deltaT', STRAT_TEXT[S.lang].tempLabel, S.rotWhatIf.deltaT, 0, 4, ' °C', 0.5)}</div>
            <p class="mt-3 text-sm leading-relaxed text-muted">${R.dryRainHint(dry || '–')}</p>
            ${rxTempNoteHtml()}
          </div>`
      }

      function renderRotationResults() {
        const R = ROT_TEXT[S.lang]
        const district = PROVINCES.find((p) => p.id === S.rotDistrict)
        const inputs = districtInputs(PRECOMPUTED, district.id)
        const result = rankRotations({ ...inputs, priorities: S.rotPriorities, whatIf: rxWhatIf() }) // rxWhatIf: site/pages/rotationExtras.js
        const box = $('#rot-results')
        if (!result.rankable) {
          box.innerHTML = `<p class="rounded-[28px] border border-dashed border-sun-400 bg-sun-100 p-6 text-[15px] font-semibold leading-relaxed text-sun-700">${esc(R.notRankable(district.name, result.reason.peaks))}</p>`
          return
        }
        const baseline = result.rotations.find((r) => r.baseline)
        const calendar = result.windows
          .map((w) => `<span class="font-bold text-ink">${R.seasons[w.season]}</span> ${R.months[w.months[0] - 1]}–${R.months[w.months[w.months.length - 1] - 1]}`)
          .join(' · ')
        box.innerHTML = `
          <div class="flex flex-wrap items-center gap-x-4 gap-y-2 rounded-[28px] border border-line bg-white px-6 py-4 text-[15px] text-muted shadow-card">
            ${icon('calendar-range', 'size-5 text-moss-700')}<span>${R.calendarLead} (${SOURCES.modis.short}): ${calendar}</span>
            ${badge(CONF_TONE[result.calendarConfidence], R.levels[result.calendarConfidence])}
          </div>
          <p class="mt-4 text-sm text-muted">${R.scoreNote}${S.rotWhatIf.dryRainPct !== 0 || S.rotWhatIf.deltaT !== 0 ? ` ${whatIfTag()} ${S.rotWhatIf.dryRainPct !== 0 ? R.whatIfActive(S.rotWhatIf.dryRainPct) : ''}${rxActiveNote()}` : ''}</p>
          ${rxStrategiesHtml(result)}
          <div class="mt-6 grid gap-5 lg:grid-cols-2">${result.rotations
            .map((rot) => {
              // Hạng = 1 + số kiểu có điểm CAO HƠN. Bằng điểm thì đồng hạng.
              const rank = 1 + result.rotations.filter((r) => r.total > rot.total).length
              const tied = result.rotations.filter((r) => r.total === rot.total).length > 1
              return rotationCard(rot, rank, baseline, R, tied)
            })
            .join('')}</div>`
      }

      // Dải 12 tháng: một bảng thật (<table>) để đọc được bằng trình đọc màn hình và cuộn ngang trên điện thoại.
      const SEASON_TONE = { dx: 'bg-moss-900 text-white', ht: 'bg-moss-100 text-moss-900', td: 'bg-lime-100 text-moss-900' }
      const ndviColor = (v) => (v > 0.65 ? '#3fae4a' : v >= 0.55 ? '#9fd55a' : '#dccb8c') // thang NDVI của DESIGN.md

      function renderSeasonStrip() {
        const R = ROT_TEXT[S.lang]
        const inputs = districtInputs(PRECOMPUTED, S.rotDistrict)
        const monthly = PRECOMPUTED.rule.districts.find((d) => d.id === S.rotDistrict).monthly
        const strip = seasonStrip({ climate: inputs.climate, monthly, windows: seasonWindows(inputs.peakDays) })
        const num = (v, d = 0) => Number(v).toLocaleString(R.locale, { minimumFractionDigits: d, maximumFractionDigits: d })
        const maxRain = Math.max(...strip.map((s) => s.rainMm))

      function shareSnapshot() {
        const vi = S.lang === 'vi'
        const MT = MAP_TEXT[S.lang]
        const RT = ROT_TEXT[S.lang]
        if (MF.loc) {
          const poly = typeof mfdPolygon === 'function' ? mfdPolygon() : null
          const areaHa = poly && typeof geoAreaM2 === 'function' ? (geoAreaM2(poly) / 10000).toFixed(2) : null
          const place = MF.loc.name || `${MF.loc.lat.toFixed(4)}, ${MF.loc.lon.toFixed(4)}`
          const elig = (MW.evalResult?.strategies ?? []).filter((s) => s.eligibility === 'eligible').sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99))
          const top = elig[0]
          const summary = top
            ? vi
              ? `Chiến lược dẫn đầu: ${top.strategyId} (${top.crops.map((c) => RT.crops[c]).join(' – ')}) · ${top.score}/100 · Rủi ro: ${MT.strat.risk[top.riskLevel]}.`
              : `Top strategy: ${top.strategyId} (${top.crops.map((c) => RT.crops[c]).join(' – ')}) · ${top.score}/100 · Risk: ${MT.strat.risk[top.riskLevel]}.`
            : vi
              ? 'Chưa đủ điều kiện xếp hạng chiến lược tại điểm này; xem chi tiết các tiêu chí và mục thiếu thông tin trên bản đồ.'
              : 'Not yet rankable at this point; review criteria and missing local inputs in My field.'
          const steps = [
            areaHa ? (vi ? `Diện tích khoanh thửa: ${areaHa} ha` : `Drawn boundary: ${areaHa} ha`) : null,
            MW.evalResult?.evaluationId ? `${MT.plan.evalTag}: ${MW.evalResult.evaluationId}` : null,
            vi ? 'Trao đổi với cán bộ khuyến nông địa phương trước khi xuống giống.' : 'Review with a local extension officer before sowing.',
          ].filter(Boolean)
          return { headline: `${place}`, summary, steps, footer: 'NASA POWER · MODIS · Open-Meteo Elevation' }
        }
        const rotRes = rankRotations(districtInputs(PRECOMPUTED, S.rotDistrict), S.rotPriorities, S.rotWhatIf)
        const dName = PROVINCES.find((p) => p.id === S.rotDistrict)?.name ?? S.rotDistrict
        const best = rotRes.ranked?.[0]
        return {
          headline: dName,
          summary: best
            ? vi
              ? `Luân canh đứng đầu theo ưu tiên hiện tại: ${best.id} (${best.crops.map((c) => RT.crops[c]).join(' – ')}) · ${best.total}/100.`
              : `Top rotation for current priorities: ${best.id} (${best.crops.map((c) => RT.crops[c]).join(' – ')}) · ${best.total}/100.`
            : vi
              ? 'Chưa rõ lịch 3 vụ ổn định từ NDVI MODIS cho huyện này.'
              : 'No clear 3-crop NDVI calendar for this district yet.',
          steps: [vi ? 'Mở mục Ruộng của tôi để khoanh thửa và nhập độ mặn/pH thực tế.' : 'Open My field to draw your field boundary and enter salinity/pH.'],
          footer: 'MODIS MOD13Q1 · NASA POWER · Linh et al. · FAO',
        }
      }

                  <p class="mt-1 text-xs text-muted">${T_.footer}</p>
                </article>
                <div id="qr-box" class="flex flex-col items-center gap-2 rounded-3xl bg-white p-5 text-center shadow-card sm:w-60">
                  <p class="text-sm font-extrabold">${T_.qrTitle}</p>
                  ${served ? '<div class="size-44 animate-pulse rounded-2xl bg-moss-50"></div>' : `<p class="text-xs leading-relaxed text-muted">${L[S.lang].servedOnly}</p>`}
                </div>
              </div>
              <div class="mt-6 flex flex-wrap gap-2">
                ${pillBtn(`${icon('printer', 'size-4')}${T_.print}`, 'data-action="print"', 'dark')}
                ${pillBtn(`${icon('copy', 'size-4')}<span id="copy-label">${T_.copy}</span>`, 'data-action="copy"', 'ghost')}
                ${navigator.share ? pillBtn(`${icon('send', 'size-4')}${T_.sendNative}`, 'data-action="native-share"', 'ghost') : ''}
              </div>
            </div>
          </div>`
        root.querySelector('[data-action="close-dialog"]').focus()
        if (served) {
          fetch('/api/lan-qr')
            .then((r) => (r.ok ? r.json() : Promise.reject()))
            .then(({ url, svg }) => {
              const box = $('#qr-box')
              if (box) box.innerHTML = `<p class="text-sm font-extrabold">${T_.qrTitle}</p><div class="w-44 [&>svg]:h-auto [&>svg]:w-full">${svg}</div><p class="tabular break-all text-xs text-muted">${esc(url)}</p><p class="text-xs text-muted">${T_.qrHint}</p>`
            })
            .catch(() => {
              const box = $('#qr-box')
              if (box) box.innerHTML = `<p class="text-sm font-extrabold">${T_.qrTitle}</p><p class="text-xs leading-relaxed text-muted">${T_.qrUnavailable}</p>`
            })
        }
      }

      function shareText() {
        const T_ = t()
        const snap = shareSnapshot()
        return [snap.headline, '', snap.summary, '', ...snap.steps.map((s, i) => `${i + 1}. ${s}`), '', `${appName()} · ${snap.footer}`, T_.footer].join('\n')
      }

      function renderAssistant(root) {
        const T_ = t()
        const msgs = S.chat
          .map((m) =>
            m.role === 'user'
              ? `<p class="ml-auto w-fit max-w-[85%] rounded-3xl rounded-br-lg bg-moss-900 px-4 py-2.5 text-[15px] leading-relaxed text-white">${esc(m.text)}</p>`
              : `<div class="max-w-[92%] rounded-3xl rounded-bl-lg border border-line bg-white px-4 py-3 shadow-card"><p class="whitespace-pre-wrap text-[15px] leading-relaxed">${m.text ? esc(m.text).replace(/\*\*(.+?)\*\*/g, '<strong class="font-extrabold">$1</strong>').replace(/^\s*[*-] /gm, '• ') : `<span class="text-muted">${T_.answering}</span>`}${
                  m.pending && m.text ? '<span class="ml-0.5 inline-block h-4 w-1.5 animate-pulse rounded-sm bg-lime-500 align-middle"></span>' : ''
                }</p>${!m.pending ? `<p class="mt-2 flex items-center gap-1 text-xs font-bold text-muted">${icon('sparkles', 'size-3.5')}${m.source === 'ai' ? T_.aiAnswer : T_.sampleAnswer}</p>` : ''}</div>`,
          )
          .join('')
        const existing = $('#chat-list')
        if (existing) {
          existing.innerHTML = msgs || suggestions()
          existing.scrollTop = existing.scrollHeight
          $('#chat-send').disabled = S.busy
          return
        }
        root.innerHTML = `
          <div class="scrim-in fixed inset-0 z-50 flex justify-end bg-moss-950/40" data-scrim>
            <aside role="dialog" aria-modal="true" aria-labelledby="assistant-title" class="drawer-in flex h-dvh w-full flex-col bg-ground shadow-lift sm:w-[440px] sm:rounded-l-[32px]">
              <header class="flex items-center justify-between gap-3 px-6 py-5">
                <h2 id="assistant-title" class="flex items-center gap-3 text-lg font-extrabold"><span class="grid size-10 place-items-center rounded-full bg-lime-400 text-moss-950">${icon('bot', 'size-5')}</span>${T_.assistantTitle}</h2>
                <button type="button" data-action="close-dialog" aria-label="${T_.close}" class="rounded-full p-2 text-muted hover:bg-white hover:text-ink">${icon('x', 'size-5')}</button>
              </header>
              <div id="chat-list" class="flex-1 space-y-3 overflow-y-auto px-6 pb-4" aria-live="polite">${msgs || suggestions()}</div>
              <form id="chat-form" class="flex items-end gap-2 border-t border-line bg-white px-4 py-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
                <label for="chat-input" class="sr-only">${T_.placeholder}</label>
                <textarea id="chat-input" rows="1" maxlength="600" placeholder="${T_.placeholder}" class="max-h-32 min-h-12 flex-1 resize-none rounded-3xl border border-line bg-ground px-4 py-3 text-[15px] outline-none placeholder:text-muted focus:border-moss-700"></textarea>
                <button id="chat-send" type="submit" aria-label="${T_.send}" class="grid size-12 shrink-0 place-items-center rounded-full bg-lime-400 text-moss-950 transition-colors hover:bg-lime-300 disabled:bg-line">${icon('send-horizontal', 'size-5')}</button>
              </form>
            </aside>
          </div>`
        $('#chat-input').focus()
      }
      const suggestions = () => {
        const T_ = t()
        return `<p class="leading-relaxed text-muted">${T_.assistantIntro}</p><div class="mt-4 flex flex-col items-start gap-2">${T_.suggestions
          .map((s) => `<button type="button" data-action="ask" data-value="${esc(s)}" class="rounded-full border border-line bg-white px-4 py-2 text-left text-sm font-bold text-moss-900 transition-colors hover:border-moss-700">${esc(s)}</button>`)
          .join('')}</div>`
      }

      async function ask(q) {
        q = q.trim()
        if (!q || S.busy) return
        S.busy = true
        const history = [...S.chat, { role: 'user', text: q }]
        S.chat = [...history, { role: 'model', text: '', source: 'ai', pending: true }]
        renderOverlay()
        const last = () => S.chat[S.chat.length - 1]
        const data = typeof mfCompute === 'function' ? mfCompute() : null
        const poly = typeof mfdPolygon === 'function' ? mfdPolygon() : null
        const areaM2 = poly && typeof geoAreaM2 === 'function' ? geoAreaM2(poly) : 0
        const rotResult = rankRotations(districtInputs(PRECOMPUTED, S.rotDistrict), S.rotPriorities, S.rotWhatIf)
        const ctx = assistantContext({
          loc: typeof MF !== 'undefined' ? MF.loc : null,
          data,
          evalResult: typeof MW !== 'undefined' ? MW.evalResult : null,
          rotDistrict: S.rotDistrict,
          rotResult,
          areaM2,
          polygon: poly,
        })
        const allowed = asstLedgerNumbers(ctx, typeof MF_LEDGER !== 'undefined' ? MF_LEDGER : null)
        let answer = null
        if (served) {
          try {
            const res = await fetch('/api/assistant', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                lang: S.lang,
                context: ctx,
                messages: history.slice(-10).map((m) => ({ role: m.role, text: m.text })),
              }),
            })
            if (res.ok && res.body) {
              const reader = res.body.getReader()
              const dec = new TextDecoder()
              let text = ''
              for (;;) {
                const { done, value } = await reader.read()
                if (done) break
                text += dec.decode(value, { stream: true })
                last().text = text
                renderOverlay()
              }
              const trimmed = text.trim()
              const check = trimmed ? asstVerifyReply(trimmed, allowed) : { ok: false }
              answer = check.ok ? trimmed : null
            }
          } catch {
            answer = null
          }
        }
        Object.assign(last(), answer ? { text: answer, pending: false } : { text: fallbackAnswer(q, ctx, S.lang), source: 'sample', pending: false })
        S.busy = false
        renderOverlay()
      }

      /* ================================================================
       * Render orchestration
       * ================================================================ */
      function renderAll() {
        document.documentElement.lang = S.lang
        renderNav()
        renderHero()
        renderHeroChip()
        renderStats()
        renderMission()
        renderPagesOverview()
        renderMyField()
        renderRotations()
        renderDataHub() // trang Dữ liệu (Phase 2): site/pages/dataHub.js
        renderSources()
        renderCta()
        renderFooter()
        renderFloating()
        renderOverlay()
        closeTerm()
        showPage(S.page) // giữ trang đang mở; cập nhật tiêu đề tab và menu theo ngôn ngữ mới
        wireMotion()
      }

      const revealNow = (sel) => document.querySelectorAll(sel).forEach((el) => el.classList.add('is-in'))

      /* ================================================================
       * Actions
       * ================================================================ */
      const persist = () => {
        store.set('naf-lang', S.lang)
        store.set('naf-rot-district', S.rotDistrict)
        store.set('naf-rot-priorities', S.rotPriorities)
      }

      document.addEventListener('click', (e) => {
        // Sổ bằng chứng: chạm vào một con số in bởi showValue() (site/pages/myField.js)
        const evBtn = e.target.closest('[data-ev]')
        if (evBtn) {
          e.preventDefault()
          return mfOpenLedger(evBtn)
        }
        const termBtn = e.target.closest('[data-term]')
        if (termBtn) {
          e.preventDefault()
          return openTerm(termBtn)
        }
        if (openTermEl && !e.target.closest('#term-pop')) closeTerm()
        if (e.target.matches('[data-scrim]')) {
          S.dialog = null
          return renderOverlay()
        }
        const a = e.target.closest('[data-action]')
        if (!a) return
        const v = a.dataset.value
        switch (a.dataset.action) {
          case 'lang':
            S.lang = v
            persist()
            return renderAll()
          case 'rot-reset-weights':
            S.rotPriorities = { ...DEFAULT_PRIORITIES }
            persist()
            renderRotationControls()
            return renderRotationResults()
          case 'rot-reset-whatif':
            S.rotWhatIf = { ...DEFAULT_WHAT_IF, deltaT: 0 }
            renderRotationControls()
            return renderRotationResults()
          case 'goto':
            return goTo(v)
          case 'menu':
            S.menuOpen = !S.menuOpen
            return renderNav()
          case 'share':
            S.dialog = 'share'
            return renderOverlay()
          case 'assistant':
            S.dialog = 'assistant'
            return renderOverlay()
          case 'close-dialog':
            S.dialog = null
            return renderOverlay()
          case 'close-term':
            return closeTerm()
          case 'print':
            return window.print()
          case 'copy':
            return navigator.clipboard?.writeText(shareText()).then(() => {
              const l_ = $('#copy-label')
              if (l_) l_.textContent = t().copied
            })
          case 'native-share':
            return navigator.share({ title: appName(), text: shareText() }).catch(() => {})
          case 'ask':
            return ask(v)
        }
      })

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return
        if (openTermEl) return closeTerm()
        if (S.dialog) {
          S.dialog = null
          return renderOverlay()
        }
      })

      document.addEventListener('change', (e) => {
        // Thả thanh giả định: vẽ lại khung để hiện/ẩn viền nét đứt và nhãn "giả định".
        if (e.target.dataset?.rotWhatif) return renderRotationControls()
        const sel = e.target.closest('[data-select]')
        if (!sel) return
        if (sel.dataset.select === 'rotDistrict') {
          S.rotDistrict = sel.value
          persist()
          renderRotations()
          return revealNow('#rotations [data-reveal]')
        }
      })

      // Kéo thanh trượt luân canh: chỉ vẽ lại phần kết quả, để thanh đang kéo không bị thay mới.
      function updateRotSlider(input) {
        const value = Number(input.value)
        const min = Number(input.min)
        const max = Number(input.max)
        input.style.setProperty('--fill', `${((value - min) / (max - min)) * 100}%`)
        const key = input.dataset.rotWeight ?? input.dataset.rotWhatif
        $(`#rot-out-${key}`).textContent = `${value}${input.dataset.unit}`
        return value
      }

      document.addEventListener('input', (e) => {
        if (e.target.dataset?.rotWeight) {
          S.rotPriorities = { ...S.rotPriorities, [e.target.dataset.rotWeight]: updateRotSlider(e.target) }
          persist()
          return renderRotationResults()
        }
        if (e.target.dataset?.rotWhatif) {
          S.rotWhatIf = { ...S.rotWhatIf, [e.target.dataset.rotWhatif]: updateRotSlider(e.target) }
          return renderRotationResults()
        }
      })

      document.addEventListener('submit', (e) => {
        if (e.target.id !== 'chat-form') return
        e.preventDefault()
        const input = $('#chat-input')
        const q = input.value
        input.value = ''
        ask(q)
      })
      document.addEventListener('keydown', (e) => {
        if (e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          $('#chat-form').requestSubmit()
        }
      })

      /* ================================================================
       * Motion: reveal on scroll, count-ups, the statement, the nav
       * ================================================================ */
      const io = new IntersectionObserver(
        (entries) => {
          for (const en of entries) {
            if (!en.isIntersecting) continue
            en.target.classList.add('is-in')
            en.target.querySelectorAll('[data-count]').forEach(countUp)
            io.unobserve(en.target)
          }
        },
        { threshold: 0.12, rootMargin: '0px 0px -40px 0px' },
      )
      function wireMotion() {
        document.querySelectorAll('[data-reveal]:not(.is-in)').forEach((el) => {
          if (reduced()) {
            el.classList.add('is-in')
            el.querySelectorAll('[data-count]').forEach(countUp)
          } else io.observe(el)
        })
        onScroll()
      }
      function countUp(el) {
        if (el.dataset.done) return
        el.dataset.done = '1'
        const target = Number(el.dataset.count)
        if (reduced()) return (el.textContent = target)
        const t0 = performance.now()
        const step = (now) => {
          const k = Math.min(1, (now - t0) / 1400)
          el.textContent = Math.round(target * (1 - Math.pow(1 - k, 4)))
          if (k < 1) requestAnimationFrame(step)
        }
        requestAnimationFrame(step)
      }
      let ticking = false
      function onScroll() {
        if (ticking) return
        ticking = true
        requestAnimationFrame(() => {
          ticking = false
          // Thanh menu trong suốt chỉ khi đang ở đầu Trang chủ (nằm trên ảnh); các trang khác luôn nền trắng.
          $('#nav').dataset.solid = String(scrollY > 40 || S.page !== 'home')
        })
      }
      addEventListener('scroll', onScroll, { passive: true })
      let resizeTimer
      addEventListener('resize', () => {
        clearTimeout(resizeTimer)
        resizeTimer = setTimeout(closeTerm, 150)
      })

      /* ================================================================
       * Start
       * ================================================================ */
      renderAll()
      route() // mở đúng trang theo địa chỉ, vd. tải lại ở #/luan-canh thì vẫn ở trang Luân canh
      requestAnimationFrame(() => revealNow('#hero [data-reveal]'))
    </script>
  </body>
</html>
